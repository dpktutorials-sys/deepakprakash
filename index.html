<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Student Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .bg-mesh {
            background-color: #ffffff;
            background-image: radial-gradient(at 0% 0%, hsla(45,100%,93%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(260,100%,95%,1) 0, transparent 50%);
        }
        .editing-mode { border: 2px dashed #4f46e5 !important; background: rgba(79, 70, 229, 0.05); padding: 4px; border-radius: 8px; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-mesh min-h-screen relative pb-20">

    <!-- ADMIN OVERLAY CONTROLS -->
    <div class="fixed top-6 right-6 z-50 flex items-center gap-3">
        <button id="loginBtn" onclick="toggleModal('loginModal')" class="bg-white/90 backdrop-blur px-5 py-2 rounded-full font-bold shadow-sm border border-slate-200 text-slate-700 hover:bg-white transition">
            <i class="fas fa-user-shield mr-2"></i>Admin Login
        </button>
        <div id="adminTools" class="hidden flex gap-2">
            <button onclick="saveHero()" class="bg-green-600 text-white px-5 py-2 rounded-full font-bold shadow-lg hover:bg-green-700 transition">
                <i class="fas fa-save mr-2"></i>Save Header
            </button>
            <button onclick="logout()" class="bg-slate-800 text-white p-2.5 rounded-full shadow-lg hover:bg-black transition">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <!-- HERO SECTION -->
    <header class="max-w-7xl mx-auto px-10 pt-20 lg:pt-32 pb-20 flex flex-col lg:flex-row items-center">
        <div class="lg:w-1/2 space-y-8">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg"><i class="fas fa-graduation-cap text-white"></i></div>
                <span class="text-xl font-black text-slate-900 tracking-tight">YOUR LEARNING SITE</span>
            </div>
            <h1 class="text-5xl lg:text-7xl font-extrabold text-slate-900 leading-tight">
                <span id="txt-blue" class="text-indigo-600">Smart Study</span><br>
                <span id="txt-black">Portal</span>
            </h1>
            <p id="txt-desc" class="text-slate-500 text-xl max-w-lg leading-relaxed">Welcome to your central hub for learning materials, video lectures, and study notes.</p>
            <a href="#hub" class="inline-block bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition">Start Learning Now <i class="fas fa-arrow-down ml-2"></i></a>
        </div>
        <div class="lg:w-1/2 relative mt-16 lg:mt-0 flex justify-center">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=600&q=80" class="rounded-[3rem] w-full max-w-md shadow-2xl border-[12px] border-white relative z-10">
        </div>
    </header>

    <!-- STUDY HUB SECTION -->
    <section id="hub" class="max-w-7xl mx-auto px-10 py-20">
        <div class="flex justify-between items-end mb-12">
            <div>
                <h2 class="text-4xl font-extrabold text-slate-900">Your Study Hub</h2>
                <p class="text-slate-500 mt-2">Access all your resources in one place</p>
            </div>
            <!-- ADMIN ONLY: ADD RESOURCE BUTTON -->
            <button id="addResourceBtn" onclick="toggleModal('resourceModal')" class="hidden bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
                <i class="fas fa-plus mr-2"></i>Add New Resource
            </button>
        </div>

        <!-- RESOURCE GRID -->
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will be generated here by JavaScript -->
            <div class="animate-pulse bg-white/50 h-64 rounded-3xl"></div>
            <div class="animate-pulse bg-white/50 h-64 rounded-3xl"></div>
            <div class="animate-pulse bg-white/50 h-64 rounded-3xl"></div>
        </div>
    </section>

    <!-- MODAL: LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm mx-4">
            <h2 class="text-2xl font-bold mb-6">Admin Access</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-xl mb-4 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-xl mb-6 outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">Login</button>
            <button onclick="toggleModal('loginModal')" class="w-full text-slate-400 mt-4 text-sm">Cancel</button>
        </div>
    </div>

    <!-- MODAL: ADD RESOURCE -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md mx-4">
            <h2 class="text-2xl font-bold mb-6">Add New Resource</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Resource Title (e.g. Algebra Basics)" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <select id="resType" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                    <option value="video">YouTube Video</option>
                    <option value="note">Study Notes / PDF</option>
                    <option value="link">Website Link</option>
                </select>
                <input type="text" id="resUrl" placeholder="Paste URL Here" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <textarea id="resDesc" placeholder="Short description..." class="w-full p-4 bg-slate-50 border rounded-xl outline-none h-24"></textarea>
                <button onclick="addNewResource()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg">Publish Resource</button>
                <button onclick="toggleModal('resourceModal')" class="w-full text-slate-400 font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site",
            storageBucket: "your-learning-site.firebasestorage.app",
            messagingSenderId: "150311153752",
            appId: "1:150311153752:web:50d999325bc866865bda2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 1. HERO CONTENT MANAGEMENT ---
        async function loadHero() {
            const snap = await getDoc(doc(db, "siteData", "hero"));
            if (snap.exists()) {
                const d = snap.data();
                document.getElementById('txt-blue').innerText = d.blue;
                document.getElementById('txt-black').innerText = d.black;
                document.getElementById('txt-desc').innerText = d.desc;
            }
        }

        window.saveHero = async () => {
            await setDoc(doc(db, "siteData", "hero"), {
                blue: document.getElementById('txt-blue').innerText,
                black: document.getElementById('txt-black').innerText,
                desc: document.getElementById('txt-desc').innerText
            });
            alert("Header Saved!");
        };

        // --- 2. RESOURCE HUB MANAGEMENT ---
        const resourceGrid = document.getElementById('resourceGrid');

        // Listen for data in real-time
        onSnapshot(collection(db, "resources"), (snapshot) => {
            resourceGrid.innerHTML = '';
            snapshot.forEach((doc) => {
                const res = doc.data();
                const isAdmin = auth.currentUser ? '' : 'hidden';
                
                let icon = 'fa-link';
                if(res.type === 'video') icon = 'fa-play-circle text-red-500';
                if(res.type === 'note') icon = 'fa-file-alt text-blue-500';

                resourceGrid.innerHTML += `
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 card-hover transition-all relative group">
                        <div class="text-4xl mb-6"><i class="fas ${icon}"></i></div>
                        <h3 class="text-xl font-extrabold text-slate-900 mb-2">${res.title}</h3>
                        <p class="text-slate-500 text-sm mb-6">${res.desc}</p>
                        <div class="flex items-center justify-between">
                            <a href="${res.url}" target="_blank" class="text-indigo-600 font-bold hover:underline">Open Material <i class="fas fa-external-link-alt ml-1 text-xs"></i></a>
                            <button onclick="deleteResource('${doc.id}')" class="${isAdmin} text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        });

        window.addNewResource = async () => {
            const title = document.getElementById('resTitle').value;
            const type = document.getElementById('resType').value;
            const url = document.getElementById('resUrl').value;
            const desc = document.getElementById('resDesc').value;

            if(!title || !url) return alert("Title and URL required");

            await addDoc(collection(db, "resources"), { title, type, url, desc, createdAt: Date.now() });
            toggleModal('resourceModal');
            // Reset fields
            document.getElementById('resTitle').value = '';
            document.getElementById('resUrl').value = '';
            document.getElementById('resDesc').value = '';
        };

        window.deleteResource = async (id) => {
            if(confirm("Delete this resource?")) await deleteDoc(doc(db, "resources", id));
        };

        // --- 3. AUTH LOGIC ---
        window.handleLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                toggleModal('loginModal');
            } catch (e) { alert(e.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminTools').classList.toggle('hidden', !isAdm);
            document.getElementById('addResourceBtn').classList.toggle('hidden', !isAdm);
            
            ['txt-blue', 'txt-black', 'txt-desc'].forEach(id => {
                const el = document.getElementById(id);
                el.contentEditable = isAdm;
                isAdm ? el.classList.add('editing-mode') : el.classList.remove('editing-mode');
            });
        });

        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');

        loadHero();
    </script>
</body>
</html>
