<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPK TUTORIALS - Educational Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- PDF Rendering Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        .glass-nav { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); transition: transform 0.4s ease-in-out; position: fixed; top: 0; width: 100%; z-index: 100; }
        .nav-hidden { transform: translateY(-100%); }
        
        .slider-wrap { position: relative; width: 100%; height: 45vh; overflow: hidden; background: #0f172a; margin-top: 80px; }
        @media (min-width: 1024px) { .slider-wrap { height: 75vh; margin-top: 88px; } }
        
        .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .slide.active { opacity: 1; }
        .slider-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(to top, #f8fafc, transparent); z-index: 10; }
        
        .card-entry { animation: cardSlideUp 0.6s ease-out forwards; opacity: 0; }
        @keyframes cardSlideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .thumb-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 2rem 2rem 0 0; background: #f1f5f9; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .card-entry:hover .thumb-img { transform: scale(1.1); }
        
        /* Auto-Generated Note Cover */
        .note-cover { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
        .bg-pdf { background: linear-gradient(135deg, #ef4444, #991b1b); }
        .bg-doc { background: linear-gradient(135deg, #3b82f6, #1e3a8a); }
        .bg-ppt { background: linear-gradient(135deg, #f59e0b, #9a3412); }
        .bg-gen { background: linear-gradient(135deg, #6366f1, #3730a3); }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav id="mainNav" class="glass-nav border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
            <!-- SITE LOGO -->
            <div class="flex items-center">
                <img src="logo.png" alt="DPK TUTORIALS" class="h-14 w-auto object-contain transition hover:opacity-80">
            </div>

            <!-- MENU LINKS -->
            <div class="hidden md:flex items-center gap-10 font-bold text-slate-500 text-xs uppercase tracking-widest">
                <button onclick="filterType('all')" class="hover:text-indigo-600 transition">Home</button>
                <button onclick="filterType('video')" class="hover:text-indigo-600 transition">Videos</button>
                <button onclick="filterType('note')" class="hover:text-indigo-600 transition">Notes/Files</button>
            </div>

            <!-- ADMIN BUTTONS -->
            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-[10px] font-black text-slate-400 border px-4 py-2 rounded-full uppercase hover:bg-slate-50">Admin</button>
                <div id="adminPanel" class="hidden flex items-center gap-3">
                    <button onclick="toggle('imageModal')" class="bg-indigo-600 text-white text-[10px] px-5 py-2.5 rounded-full font-black uppercase shadow-lg">Manage Slides</button>
                    <button onclick="logout()" class="text-red-500 bg-white border p-2.5 rounded-full shadow-sm hover:bg-red-50"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO SLIDER -->
    <div class="slider-wrap">
        <div id="slider">
            <div class="absolute inset-0 flex items-center justify-center text-slate-400 bg-slate-900 font-bold uppercase tracking-widest text-xs">
                <i class="fas fa-spinner fa-spin mr-3"></i> Syncing Classroom Media...
            </div>
        </div>
        <div class="slider-overlay"></div>
    </div>

    <!-- MAIN HUB -->
    <main class="max-w-7xl mx-auto px-6 py-16 flex-grow w-full">
        <div class="flex flex-col md:flex-row items-center justify-between mb-20 gap-10">
            <div>
                <h2 id="hubTitle" class="text-5xl font-black text-slate-900 tracking-tight">DPK Resource Hub</h2>
                <p class="text-slate-400 font-medium mt-1">Providing out and out educational resources</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <div class="flex items-center bg-white px-6 py-4 rounded-3xl border border-slate-100 shadow-xl w-full md:w-96">
                    <i class="fas fa-search text-slate-300 mr-4"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search library..." class="bg-transparent outline-none text-sm w-full font-semibold">
                </div>
                <button id="addResBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-10 py-4 rounded-3xl font-extrabold shadow-2xl hover:scale-105 transition">
                    <i class="fas fa-plus mr-2"></i> Add Content
                </button>
            </div>
        </div>
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#001b3a] text-white py-20 mt-auto">
        <div class="max-w-7xl mx-auto px-10 text-center">
            <div class="flex justify-center mb-8">
                <img src="logo.png" alt="Logo" class="h-16 w-auto grayscale brightness-200 opacity-50">
            </div>
            <p class="text-2xl font-bold mb-4">© <span id="year"></span> DPK TUTORIALS. All Rights Reserved.</p>
            <p class="text-slate-400 text-sm font-medium uppercase tracking-[0.3em]">Designed by <span class="text-indigo-400 font-black">Deepak Prakash Bhatta</span></p>
        </div>
    </footer>

    <!-- VIDEO MODAL -->
    <div id="videoModal" onclick="handleOutsideClick(event)" class="fixed inset-0 bg-black/98 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-8 right-8 text-white/40 text-5xl hover:text-red-500 transition"><i class="fas fa-times-circle"></i></button>
        <div class="w-full max-w-5xl aspect-video rounded-3xl overflow-hidden border-4 border-white/10 bg-black">
            <iframe id="vFrame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- MODAL: ADD RESOURCE -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4 overflow-y-auto">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md my-8 relative">
            <button onclick="toggle('resourceModal')" class="absolute top-8 right-8 text-slate-300 text-3xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-3xl font-black mb-8 text-slate-900">Post Material</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Title of Lesson" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                <div class="flex gap-4">
                    <select id="resType" class="border rounded-2xl p-4 bg-white font-bold outline-none" onchange="updateForm(this.value)">
                        <option value="video">Video</option>
                        <option value="note">Note/File</option>
                    </select>
                    <input type="text" id="resLevel" placeholder="Class/Grade" class="flex-1 p-4 border rounded-2xl bg-slate-50 outline-none">
                </div>
                <div id="autoThumbBox" class="hidden p-6 bg-indigo-50 rounded-[2rem] border-2 border-dashed border-indigo-200">
                    <label class="block text-[10px] font-black text-indigo-500 mb-2 uppercase text-center">PDF for Auto-Thumb</label>
                    <input type="file" id="resFile" accept="application/pdf,image/*" class="text-xs w-full cursor-pointer">
                </div>
                <input type="text" id="resUrl" placeholder="URL (YouTube or Google Drive)" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                <textarea id="resDesc" placeholder="Description..." class="w-full p-4 border rounded-2xl bg-slate-50 outline-none h-24"></textarea>
                <button onclick="addMaterial()" id="publishBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl">PUBLISH</button>
            </div>
        </div>
    </div>

    <!-- ADMIN MODALS -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[3rem] w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Access</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-2xl mb-8">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold">Login</button>
        </div>
    </div>

    <div id="imageModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-lg flex flex-col max-h-[85vh]">
            <h2 class="text-xl font-bold mb-6">Slider Manager</h2>
            <input type="file" id="fileInp" accept="image/*" class="mb-4 text-xs">
            <button onclick="savePhoto()" id="upBtn" class="bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg">Upload Slide</button>
            <div id="photoList" class="overflow-y-auto mt-6 space-y-3"></div>
            <button onclick="toggle('imageModal')" class="text-slate-400 mt-4 text-xs">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        document.getElementById('year').innerText = new Date().getFullYear();

        // NAV TRANSITION
        let lastScroll = window.scrollY;
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > lastScroll && window.scrollY > 200) nav.classList.add('nav-hidden');
            else nav.classList.remove('nav-hidden');
            lastScroll = window.scrollY;
        });

        window.updateForm = (val) => document.getElementById('autoThumbBox').classList.toggle('hidden', val === 'video');

        // SLIDER ENGINE
        let slides = []; let curIdx = 0; let timer;
        onSnapshot(query(collection(db, "slideshow"), orderBy("createdAt", "desc")), (snap) => {
            slides = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const slider = document.getElementById('slider');
            const list = document.getElementById('photoList');
            if(slides.length > 0) {
                slider.innerHTML = slides.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = slides.map(s => `<div class="flex items-center gap-4 bg-slate-50 p-2 rounded-xl border">
                    <img src="${s.url}" class="w-16 h-10 object-cover rounded shadow-sm">
                    <button onclick="deleteDoc(doc(db, 'slideshow', '${s.id}'))" class="ml-auto text-red-500 text-xs font-bold">Remove</button>
                </div>`).join('');
                if(timer) clearInterval(timer);
                if(slides.length > 1) timer = setInterval(() => {
                    const els = document.querySelectorAll('.slide');
                    if(!els[curIdx]) return;
                    els[curIdx].classList.remove('active');
                    curIdx = (curIdx + 1) % els.length;
                    els[curIdx].classList.add('active');
                }, 6000);
            }
        });

        window.savePhoto = () => {
            const file = document.getElementById('fileInp').files[0];
            if(!file) return alert("Select a file");
            const btn = document.getElementById('upBtn'); btn.innerText = "WORKING...";
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    canvas.width = 1600; canvas.height = img.height * (1600 / img.width);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    await addDoc(collection(db, "slideshow"), { url: canvas.toDataURL('image/jpeg', 0.8), createdAt: Date.now() });
                    btn.innerText = "Upload Slide"; alert("Uploaded!");
                };
            };
        };

        // RESOURCE ENGINE
        let rawRes = []; let filter = 'all';
        onSnapshot(collection(db, "resources"), (snap) => { rawRes = snap.docs.map(d => ({id: d.id, ...d.data()})); draw(); });

        window.draw = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            const isAdmin = auth.currentUser ? '' : 'hidden';

            grid.innerHTML = rawRes.filter(m => (filter === 'all' || m.type === filter) && m.title.toLowerCase().includes(q)).map(m => {
                if(m.type === 'video') {
                    const ytId = m.url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
                    return `
                        <div class="card-entry bg-white rounded-[2.5rem] shadow-xl overflow-hidden hover:shadow-2xl transition group">
                            <div class="thumb-wrap cursor-pointer" onclick="viewVideo('${m.url}')">
                                <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" class="thumb-img">
                                <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                                    <div class="w-14 h-14 bg-white/90 rounded-full flex items-center justify-center text-indigo-600 shadow-xl"><i class="fas fa-play ml-1"></i></div>
                                </div>
                                <span class="absolute top-4 left-6 bg-indigo-600 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase">${m.level}</span>
                            </div>
                            <div class="p-8"><h3 class="text-xl font-extrabold text-slate-900 mb-2 leading-tight">${m.title}</h3><p class="text-slate-400 text-sm mb-6 line-clamp-2">${m.desc}</p>
                            <div class="flex justify-between items-center border-t pt-6"><span class="text-indigo-600 font-black text-[10px] uppercase">Video Lesson</span>
                            <button onclick="deleteDoc(doc(db, 'resources', '${m.id}'))" class="${isAdmin} text-red-300 hover:text-red-500"><i class="fas fa-trash"></i></button></div></div>
                        </div>`;
                } else {
                    let thumbHtml = '';
                    if(m.thumb) { thumbHtml = `<img src="${m.thumb}" class="thumb-img">`; } 
                    else {
                        let style = 'bg-gen'; let icon = 'fa-file-alt';
                        if(m.title.toLowerCase().includes('pdf')) { style = 'bg-pdf'; icon = 'fa-file-pdf'; }
                        if(m.title.toLowerCase().includes('doc')) { style = 'bg-doc'; icon = 'fa-file-word'; }
                        if(m.title.toLowerCase().includes('ppt')) { style = 'bg-ppt'; icon = 'fa-file-powerpoint'; }
                        thumbHtml = `<div class="note-cover ${style}"><i class="fas ${icon} text-5xl mb-4"></i><span class="text-xs font-bold uppercase">Material</span></div>`;
                    }
                    return `
                        <div class="card-entry bg-white rounded-[2.5rem] shadow-xl overflow-hidden hover:shadow-2xl transition group">
                            <div class="thumb-wrap">${thumbHtml}<span class="absolute top-4 left-6 bg-slate-900 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase">${m.level}</span></div>
                            <div class="p-8"><h3 class="text-xl font-extrabold text-slate-900 mb-2 leading-tight">${m.title}</h3><p class="text-slate-400 text-sm mb-6 line-clamp-2">${m.desc}</p>
                            <div class="flex justify-between items-center border-t pt-6"><a href="${m.url}" target="_blank" class="bg-indigo-600 text-white px-6 py-2 rounded-xl text-xs font-bold hover:bg-indigo-700">Open File</a>
                            <button onclick="deleteDoc(doc(db, 'resources', '${m.id}'))" class="${isAdmin} text-red-300 hover:text-red-500"><i class="fas fa-trash"></i></button></div></div>
                        </div>`;
                }
            }).join('');
        };

        window.addMaterial = async () => {
            const btn = document.getElementById('publishBtn'); btn.innerText = "PREPARING..."; btn.disabled = true;
            const type = document.getElementById('resType').value; const title = document.getElementById('resTitle').value;
            const level = document.getElementById('resLevel').value; const url = document.getElementById('resUrl').value;
            const desc = document.getElementById('resDesc').value; const file = document.getElementById('resFile').files[0];

            let thumbData = null;
            if (type === 'note' && file) {
                try {
                    const reader = new FileReader(); reader.readAsArrayBuffer(file);
                    thumbData = await new Promise((resolve) => {
                        reader.onload = async () => {
                            const pdf = await pdfjsLib.getDocument({ data: reader.result }).promise;
                            const page = await pdf.getPage(1);
                            const viewport = page.getViewport({ scale: 1.5 });
                            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                            canvas.height = viewport.height; canvas.width = viewport.width;
                            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                            resolve(canvas.toDataURL('image/jpeg', 0.8));
                        };
                    });
                } catch (e) { console.log("Thumb skip"); }
            }
            try {
                await addDoc(collection(db, "resources"), { title, type, level, url, desc, thumb: thumbData });
                toggle('resourceModal');
            } catch (e) { alert(e.message); }
            btn.innerText = "PUBLISH"; btn.disabled = false;
        };

        window.handleLogin = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); toggle('loginModal'); } catch (e) { alert("Denied"); } };
        window.logout = () => signOut(auth);
        window.viewVideo = (url) => {
            const id = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
            document.getElementById('vFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('videoModal').classList.remove('hidden');
        };
        window.closeVideo = () => { document.getElementById('vFrame').src = ""; document.getElementById('videoModal').classList.add('hidden'); };
        window.handleOutsideClick = (e) => { if(e.target.id === 'videoModal') closeVideo(); };
        window.handleSearch = () => draw();
        window.filterType = (t) => { filter = t; document.getElementById('hubTitle').innerText = t === 'all' ? 'DPK Resource Hub' : (t === 'video' ? 'Video Lectures' : 'Study Notes'); draw(); };
        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminPanel').classList.toggle('hidden', !isAdm);
            document.getElementById('addResBtn').classList.toggle('hidden', !isAdm);
            draw();
        });
    </script>
</body>
</html>
