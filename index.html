<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Bhatta Sir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .bg-mesh {
            background-image: radial-gradient(at 0% 0%, hsla(45,100%,93%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(260,100%,95%,1) 0, transparent 50%);
        }
        .editing-mode { border: 2px dashed #4f46e5 !important; background: rgba(79, 70, 229, 0.05); padding: 4px; border-radius: 8px; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .slide { display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 2.5rem; transition: opacity 0.5s ease-in-out; }
        .slide.active { display: block; animation: fadeIn 0.8s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-mesh min-h-screen flex flex-col">

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-[100] bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg"><i class="fas fa-graduation-cap text-white text-sm"></i></div>
                <span class="font-black text-slate-900 tracking-tight">YOUR LEARNING SITE</span>
            </div>

            <div class="hidden md:flex items-center gap-8 font-bold text-slate-600">
                <button onclick="filterContent('all')" class="hover:text-indigo-600">Home</button>
                <button onclick="filterContent('video')" class="hover:text-indigo-600">Videos</button>
                <button onclick="filterContent('note')" class="hover:text-indigo-600">Notes</button>
            </div>

            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-sm font-bold text-slate-500">Admin</button>
                <div id="adminTools" class="hidden flex gap-2">
                    <button onclick="toggle('imageManagerModal')" class="bg-blue-500 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg">MANAGE PHOTOS</button>
                    <button onclick="saveHero()" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg">SAVE TEXT</button>
                    <button onclick="logout()" class="text-red-500 px-2"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="max-w-7xl mx-auto px-10 pt-16 pb-12 flex flex-col lg:flex-row items-center">
        <div class="lg:w-1/2 space-y-8 pr-4">
            <h1 class="text-5xl lg:text-7xl font-extrabold text-slate-900 leading-tight">
                <span id="txt-blue" class="text-indigo-600">Smart Study</span><br>
                <span id="txt-black">With Bhatta Sir</span>
            </h1>
            <p id="txt-desc" class="text-slate-500 text-xl max-w-lg">High-quality video lessons and notes designed for your success.</p>
            
            <!-- SEARCH -->
            <div class="flex items-center bg-white p-2 rounded-2xl shadow-xl max-w-lg border border-slate-100">
                <i class="fas fa-search ml-4 text-slate-300"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search videos or notes..." class="flex-1 px-4 py-3 outline-none bg-transparent">
                <button class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold">Search</button>
            </div>
        </div>

        <!-- SLIDESHOW CONTAINER -->
        <div class="lg:w-1/2 flex justify-center mt-12 lg:mt-0 relative">
            <div id="slideshow" class="w-full max-w-md aspect-[4/5] bg-slate-100 rounded-[2.5rem] shadow-2xl border-8 border-white overflow-hidden relative">
                <!-- Slides will be injected here -->
                <div id="slideLoader" class="absolute inset-0 flex items-center justify-center text-slate-400">
                    <i class="fas fa-circle-notch fa-spin text-4xl"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- STUDY HUB -->
    <main id="hub" class="max-w-7xl mx-auto px-10 py-20 flex-grow w-full">
        <div class="flex justify-between items-center mb-10">
            <h2 id="hubTitle" class="text-3xl font-extrabold text-slate-900">All Resources</h2>
            <button id="addResourceBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg">
                <i class="fas fa-plus mr-2"></i>Add Material
            </button>
        </div>
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <!-- NAVY BLUE FOOTER -->
    <footer class="bg-[#001f3f] text-white py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-10 text-center">
            <div class="bg-indigo-600 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-graduation-cap text-white"></i>
            </div>
            <p class="font-bold text-lg">© <span id="currentYear"></span> Bhatta Sir. All Rights Reserved.</p>
            <p class="text-slate-400 text-sm mt-2">Designed by <span class="text-indigo-400">Deepak Prakash Bhatta</span></p>
        </div>
    </footer>

    <!-- MODAL: LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200]">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm relative">
            <button onclick="toggle('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-red-500"><i class="fas fa-times-circle text-2xl"></i></button>
            <h2 class="text-2xl font-bold mb-6">Admin Login</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-xl mb-4 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-xl mb-6 outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">Login</button>
        </div>
    </div>

    <!-- MODAL: IMAGE MANAGER -->
    <div id="imageManagerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200]">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-lg relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggle('imageManagerModal')" class="absolute top-4 right-4 text-slate-400 hover:text-red-500"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold mb-4">Slideshow Manager</h2>
            
            <div class="mb-6 p-4 bg-indigo-50 rounded-xl">
                <label class="block text-sm font-bold text-indigo-600 mb-2">Upload New Photo</label>
                <input type="file" id="imageInput" accept="image/*" class="text-sm">
                <button onclick="uploadImage()" id="uploadBtn" class="mt-3 w-full bg-indigo-600 text-white py-2 rounded-lg font-bold">Upload to Slideshow</button>
            </div>

            <div id="imageList" class="space-y-3">
                <!-- Existing images list here -->
            </div>
        </div>
    </div>

    <!-- MODAL: RESOURCE & VIDEO (Logic same as before) -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md relative">
            <button onclick="toggle('resourceModal')" class="absolute top-4 right-4"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold mb-4">Add Material</h2>
            <input type="text" id="resTitle" placeholder="Title" class="w-full p-3 border rounded-lg mb-3">
            <div class="flex gap-2 mb-3">
                <select id="resType" class="border rounded-lg p-2"><option value="video">Video</option><option value="note">Note</option></select>
                <input type="text" id="resLevel" placeholder="Level/Class" class="flex-1 p-2 border rounded-lg">
            </div>
            <input type="text" id="resUrl" placeholder="Link" class="w-full p-3 border rounded-lg mb-3">
            <textarea id="resDesc" placeholder="Description" class="w-full p-3 border rounded-lg mb-4"></textarea>
            <button onclick="addNewResource()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Publish</button>
        </div>
    </div>

    <div id="videoModal" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-6 right-6 text-white text-3xl"><i class="fas fa-times"></i></button>
        <iframe id="videoFrame" class="w-full max-w-5xl aspect-video rounded-2xl" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site",
            storageBucket: "your-learning-site.firebasestorage.app",
            messagingSenderId: "150311153752",
            appId: "1:150311153752:web:50d999325bc866865bda2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- 1. DYNAMIC DATE ---
        document.getElementById('currentYear').innerText = new Date().getFullYear();

        // --- 2. SLIDESHOW LOGIC ---
        let slides = [];
        let slideIndex = 0;

        onSnapshot(collection(db, "slideshow"), (snap) => {
            slides = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const container = document.getElementById('slideshow');
            const list = document.getElementById('imageList');
            
            if(slides.length > 0) {
                container.innerHTML = slides.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = slides.map(s => `
                    <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-lg border">
                        <img src="${s.url}" class="w-12 h-12 object-cover rounded">
                        <button onclick="deleteImage('${s.id}', '${s.name}')" class="ml-auto text-red-500 text-sm font-bold">Delete</button>
                    </div>
                `).join('');
                startSlideshow();
            } else {
                container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-slate-400">No Photos Uploaded</div>';
            }
        });

        function startSlideshow() {
            setInterval(() => {
                const els = document.querySelectorAll('.slide');
                if(els.length < 2) return;
                els[slideIndex].classList.remove('active');
                slideIndex = (slideIndex + 1) % els.length;
                els[slideIndex].classList.add('active');
            }, 4000);
        }

        window.uploadImage = async () => {
            const file = document.getElementById('imageInput').files[0];
            if(!file) return alert("Select a file first");
            const btn = document.getElementById('uploadBtn');
            btn.innerText = "Uploading...";
            
            try {
                const fileName = Date.now() + "_" + file.name;
                const sRef = ref(storage, 'slides/' + fileName);
                await uploadBytes(sRef, file);
                const url = await getDownloadURL(sRef);
                await addDoc(collection(db, "slideshow"), { url, name: fileName });
                alert("Photo added!");
            } catch (e) { alert(e.message); }
            btn.innerText = "Upload to Slideshow";
        };

        window.deleteImage = async (id, name) => {
            if(!confirm("Delete photo?")) return;
            try {
                await deleteDoc(doc(db, "slideshow", id));
                await deleteObject(ref(storage, 'slides/' + name));
            } catch (e) { console.log(e); }
        };

        // --- 3. SEARCH & RESOURCES (Same logic as previous version) ---
        let allResources = [];
        onSnapshot(collection(db, "resources"), (snap) => {
            allResources = snap.docs.map(d => ({id: d.id, ...d.data()}));
            render();
        });

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            grid.innerHTML = allResources.filter(m => m.title.toLowerCase().includes(query)).map(m => `
                <div class="glass-card p-6 rounded-[2rem] shadow-sm relative group">
                    <div class="font-black text-[10px] text-indigo-400 uppercase mb-2">${m.level}</div>
                    <h3 class="text-xl font-extrabold mb-4">${m.title}</h3>
                    <div class="flex justify-between items-center">
                        ${m.type === 'video' ? `<button onclick="playVideo('${m.url}')" class="text-indigo-600 font-bold">Watch Video</button>` : `<a href="${m.url}" target="_blank" class="text-slate-900 font-bold">View Note</a>`}
                        <button onclick="deleteResource('${m.id}')" class="${auth.currentUser?'':'hidden'} text-red-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        window.handleSearch = () => render();
        window.deleteResource = (id) => deleteDoc(doc(db, "resources", id));

        window.addNewResource = async () => {
            const data = {
                title: document.getElementById('resTitle').value,
                type: document.getElementById('resType').value,
                level: document.getElementById('resLevel').value,
                url: document.getElementById('resUrl').value,
                desc: document.getElementById('resDesc').value
            };
            await addDoc(collection(db, "resources"), data);
            toggle('resourceModal');
        };

        window.playVideo = (url) => {
            const id = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            toggle('videoModal');
        };
        window.closeVideo = () => { document.getElementById('videoFrame').src = ""; toggle('videoModal'); };

        // --- 4. AUTH ---
        window.handleLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                toggle('loginModal');
            } catch (e) { alert(e.message); }
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminTools').classList.toggle('hidden', !isAdm);
            document.getElementById('addResourceBtn').classList.toggle('hidden', !isAdm);
            ['txt-blue', 'txt-black', 'txt-desc'].forEach(id => {
                const el = document.getElementById(id);
                el.contentEditable = isAdm;
                isAdm ? el.classList.add('editing-mode') : el.classList.remove('editing-mode');
            });
            render();
        });

        window.saveHero = async () => {
            await setDoc(doc(db, "siteData", "hero"), {
                blue: document.getElementById('txt-blue').innerText,
                black: document.getElementById('txt-black').innerText,
                desc: document.getElementById('txt-desc').innerText
            });
            alert("Header Saved!");
        };

        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');

        // Initial Load Header
        const hSnap = await getDoc(doc(db, "siteData", "hero"));
        if(hSnap.exists()) {
            document.getElementById('txt-blue').innerText = hSnap.data().blue;
            document.getElementById('txt-black').innerText = hSnap.data().black;
            document.getElementById('txt-desc').innerText = hSnap.data().desc;
        }
    </script>
</body>
</html>
