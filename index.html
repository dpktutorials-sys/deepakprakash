<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Bhatta Sir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .bg-mesh { background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        
        /* Full Width Slideshow CSS */
        .slideshow-container { position: relative; width: 100%; height: 75vh; overflow: hidden; background: #e2e8f0; }
        .slide { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; 
        }
        .slide.active { opacity: 1; }
        
        .overlay-gradient {
            position: absolute; bottom: 0; left: 0; right: 0; height: 30%;
            background: linear-gradient(to top, rgba(248, 250, 252, 1), transparent);
            z-index: 10;
        }
    </style>
</head>
<body class="bg-mesh min-h-screen flex flex-col">

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-[100] glass-nav border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg"><i class="fas fa-graduation-cap text-white text-sm"></i></div>
                <span class="font-black text-slate-900 tracking-tight text-lg uppercase">YOUR LEARNING SITE</span>
            </div>

            <div class="hidden md:flex items-center gap-8 font-bold text-slate-600 uppercase text-xs tracking-widest">
                <button onclick="filterContent('all')" class="hover:text-indigo-600 transition">Home</button>
                <button onclick="filterContent('video')" class="hover:text-indigo-600 transition">Videos</button>
                <button onclick="filterContent('note')" class="hover:text-indigo-600 transition">Notes</button>
            </div>

            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-xs font-bold text-slate-400 border border-slate-200 px-4 py-1.5 rounded-full hover:bg-slate-50 transition">ADMIN</button>
                <div id="adminTools" class="hidden flex gap-2">
                    <button onclick="toggle('imageManagerModal')" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg">MANAGE PHOTOS</button>
                    <button onclick="logout()" class="text-red-500 bg-white p-2 rounded-full border border-slate-100 shadow-sm"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- FULL WIDTH SLIDESHOW HERO -->
    <div class="slideshow-container">
        <div id="slideshow">
            <!-- Slides injected by JS -->
            <div id="slideLoader" class="absolute inset-0 flex items-center justify-center text-slate-400 bg-slate-100">
                <i class="fas fa-spinner fa-pulse text-4xl"></i>
            </div>
        </div>
        <div class="overlay-gradient"></div>
    </div>

    <!-- STUDY HUB -->
    <main id="hub" class="max-w-7xl mx-auto px-10 py-16 flex-grow w-full">
        <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div class="text-center md:text-left">
                <h2 id="hubTitle" class="text-4xl font-extrabold text-slate-900">Resource Library</h2>
                <div class="h-1.5 w-24 bg-indigo-600 rounded-full mt-3 mx-auto md:mx-0"></div>
            </div>
            
            <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
                <div class="flex items-center bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100 w-full">
                    <i class="fas fa-search text-slate-300 mr-2"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search library..." class="outline-none bg-transparent py-1 w-full text-sm">
                </div>
                <button id="addResourceBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg whitespace-nowrap">
                    <i class="fas fa-plus mr-2"></i>Add New
                </button>
            </div>
        </div>

        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Content Loads Here -->
        </div>
    </main>

    <!-- NAVY BLUE FOOTER -->
    <footer class="bg-[#001f3f] text-white py-14">
        <div class="max-w-7xl mx-auto px-10 text-center">
            <div class="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl">
                <i class="fas fa-graduation-cap text-white text-xl"></i>
            </div>
            <h3 class="text-xl font-black tracking-widest mb-4">BHATTA SIR PORTAL</h3>
            <p class="font-medium text-slate-300">© <span id="currentYear"></span> Bhatta Sir. All Rights Reserved.</p>
            <p class="text-slate-500 text-xs mt-3 uppercase tracking-tighter">Designed by <span class="text-indigo-400 font-bold">Deepak Prakash Bhatta</span></p>
        </div>
    </footer>

    <!-- MODAL: LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200]">
        <div class="bg-white p-10 rounded-[2rem] shadow-2xl w-full max-w-sm relative">
            <button onclick="toggle('loginModal')" class="absolute top-5 right-5 text-slate-300 hover:text-red-500 transition">
                <i class="fas fa-times-circle text-2xl"></i>
            </button>
            <h2 class="text-2xl font-bold mb-6 text-slate-900">Admin Login</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4 outline-none focus:ring-2 ring-indigo-500/20">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-2xl mb-8 outline-none focus:ring-2 ring-indigo-500/20">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition">Sign In</button>
        </div>
    </div>

    <!-- MODAL: IMAGE MANAGER -->
    <div id="imageManagerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200]">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-lg relative max-h-[85vh] flex flex-col">
            <button onclick="toggle('imageManagerModal')" class="absolute top-5 right-5 text-slate-300 hover:text-red-500">
                <i class="fas fa-times-circle text-2xl"></i>
            </button>
            <h2 class="text-2xl font-bold mb-6 text-slate-900">Slider Manager</h2>
            
            <div class="mb-8 p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center">
                <label class="block text-sm font-bold text-slate-500 mb-4 uppercase tracking-widest">Add Landscape Photo</label>
                <input type="file" id="imageInput" accept="image/*" class="text-sm block w-full text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                <button onclick="uploadImage()" id="uploadBtn" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg hover:scale-[1.02] transition">Upload New Image</button>
            </div>

            <div id="imageList" class="flex-grow overflow-y-auto space-y-4 pr-2">
                <!-- Image list injected here -->
            </div>
        </div>
    </div>

    <!-- MODAL: ADD RESOURCE & VIDEO -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-md relative shadow-2xl">
            <button onclick="toggle('resourceModal')" class="absolute top-6 right-6 text-slate-300"><i class="fas fa-times-circle text-2xl"></i></button>
            <h2 class="text-2xl font-bold mb-6">Upload Material</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Title" class="w-full p-4 border rounded-2xl outline-none bg-slate-50">
                <div class="flex gap-4">
                    <select id="resType" class="border rounded-2xl p-4 bg-slate-50 font-bold text-slate-500 outline-none"><option value="video">Video</option><option value="note">Note</option></select>
                    <input type="text" id="resLevel" placeholder="Class/Level" class="flex-1 p-4 border rounded-2xl outline-none bg-slate-50">
                </div>
                <input type="text" id="resUrl" placeholder="Link" class="w-full p-4 border rounded-2xl outline-none bg-slate-50">
                <textarea id="resDesc" placeholder="Description" class="w-full p-4 border rounded-2xl outline-none bg-slate-50 h-28"></textarea>
                <button onclick="addNewResource()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl">Post to Library</button>
            </div>
        </div>
    </div>

    <div id="videoModal" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-8 right-8 text-white/50 hover:text-white text-4xl transition"><i class="fas fa-times-circle"></i></button>
        <iframe id="videoFrame" class="w-full max-w-5xl aspect-video rounded-3xl shadow-2xl" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site",
            storageBucket: "your-learning-site.firebasestorage.app",
            messagingSenderId: "150311153752",
            appId: "1:150311153752:web:50d999325bc866865bda2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- 1. DYNAMIC YEAR ---
        document.getElementById('currentYear').innerText = new Date().getFullYear();

        // --- 2. SLIDESHOW ENGINE ---
        let slides = [];
        let slideIndex = 0;
        let slideTimer;

        onSnapshot(collection(db, "slideshow"), (snap) => {
            slides = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const container = document.getElementById('slideshow');
            const list = document.getElementById('imageList');
            
            if(slides.length > 0) {
                container.innerHTML = slides.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = slides.map(s => `
                    <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <img src="${s.url}" class="w-16 h-10 object-cover rounded-lg shadow-sm">
                        <button onclick="deleteImage('${s.id}', '${s.name}')" class="ml-auto text-red-500 font-bold text-xs uppercase tracking-widest hover:text-red-700">Remove</button>
                    </div>
                `).join('');
                
                if(slideTimer) clearInterval(slideTimer);
                if(slides.length > 1) startSlideshow();
            } else {
                container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-slate-300 font-bold uppercase tracking-widest bg-slate-100">Upload slides via admin panel</div>';
            }
        });

        function startSlideshow() {
            slideTimer = setInterval(() => {
                const els = document.querySelectorAll('.slide');
                els[slideIndex].classList.remove('active');
                slideIndex = (slideIndex + 1) % els.length;
                els[slideIndex].classList.add('active');
            }, 5000);
        }

        window.uploadImage = async () => {
            const file = document.getElementById('imageInput').files[0];
            if(!file) return alert("Please select an image file");
            const btn = document.getElementById('uploadBtn');
            btn.innerText = "Uploading to Cloud...";
            
            try {
                const fileName = Date.now() + "_" + file.name;
                const sRef = ref(storage, 'slides/' + fileName);
                await uploadBytes(sRef, file);
                const url = await getDownloadURL(sRef);
                await addDoc(collection(db, "slideshow"), { url, name: fileName });
                alert("Image uploaded successfully!");
            } catch (e) { alert(e.message); }
            btn.innerText = "Upload New Image";
        };

        window.deleteImage = async (id, name) => {
            if(!confirm("Are you sure you want to remove this photo?")) return;
            try {
                await deleteDoc(doc(db, "slideshow", id));
                await deleteObject(ref(storage, 'slides/' + name));
            } catch (e) { console.error(e); }
        };

        // --- 3. RESOURCE HUB LOGIC ---
        let allRes = [];
        let currentFilter = 'all';

        onSnapshot(collection(db, "resources"), (snap) => {
            allRes = snap.docs.map(d => ({id: d.id, ...d.data()}));
            render();
        });

        window.filterContent = (type) => {
            currentFilter = type;
            document.getElementById('hubTitle').innerText = type === 'all' ? 'Resource Library' : (type === 'video' ? 'Video Lectures' : 'Study Notes');
            render();
        };

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            const isAdmin = auth.currentUser ? '' : 'hidden';

            const filtered = allRes.filter(m => {
                const matchType = currentFilter === 'all' || m.type === currentFilter;
                const matchSearch = m.title.toLowerCase().includes(query) || m.desc.toLowerCase().includes(query);
                return matchType && matchSearch;
            });

            grid.innerHTML = filtered.map(m => `
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 hover:shadow-xl hover:-translate-y-2 transition-all group">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-12 h-12 ${m.type==='video'?'bg-red-50 text-red-500':'bg-blue-50 text-blue-500'} rounded-2xl flex items-center justify-center shadow-sm">
                            <i class="fas ${m.type==='video'?'fa-play':'fa-file-pdf'} text-xl"></i>
                        </div>
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest pt-2">${m.level}</span>
                    </div>
                    <h3 class="text-xl font-extrabold text-slate-900 mb-3 leading-tight">${m.title}</h3>
                    <p class="text-slate-400 text-sm mb-8 line-clamp-2">${m.desc}</p>
                    <div class="flex justify-between items-center border-t border-slate-50 pt-6">
                        ${m.type === 'video' ? 
                            `<button onclick="playVideo('${m.url}')" class="text-indigo-600 font-bold hover:translate-x-1 transition">Watch Lesson <i class="fas fa-chevron-right text-[10px] ml-1"></i></button>` : 
                            `<a href="${m.url}" target="_blank" class="text-slate-900 font-bold hover:text-indigo-600 transition">Open Notes <i class="fas fa-external-link-alt text-[10px] ml-1"></i></a>`
                        }
                        <button onclick="deleteResource('${m.id}')" class="${isAdmin} text-red-300 hover:text-red-600"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        window.handleSearch = () => render();
        window.deleteResource = (id) => confirm("Delete this item?") && deleteDoc(doc(db, "resources", id));

        window.addNewResource = async () => {
            const data = {
                title: document.getElementById('resTitle').value,
                type: document.getElementById('resType').value,
                level: document.getElementById('resLevel').value,
                url: document.getElementById('resUrl').value,
                desc: document.getElementById('resDesc').value
            };
            if(!data.title || !data.url) return alert("Title and URL required");
            await addDoc(collection(db, "resources"), data);
            toggle('resourceModal');
        };

        window.playVideo = (url) => {
            const id = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            toggle('videoModal');
        };
        window.closeVideo = () => { document.getElementById('videoFrame').src = ""; toggle('videoModal'); };

        // --- 4. AUTH ---
        window.handleLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                toggle('loginModal');
            } catch (e) { alert(e.message); }
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminTools').classList.toggle('hidden', !isAdm);
            document.getElementById('addResourceBtn').classList.toggle('hidden', !isAdm);
            render();
        });

        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');
    </script>
</body>
</html>
