<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Student Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .bg-mesh {
            background-image: radial-gradient(at 0% 0%, hsla(45,100%,93%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(260,100%,95%,1) 0, transparent 50%);
        }
        .editing-mode { border: 2px dashed #4f46e5 !important; background: rgba(79, 70, 229, 0.05); padding: 4px; border-radius: 8px; }
        .video-thumbnail:hover .play-overlay { opacity: 1; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="bg-mesh min-h-screen relative pb-20">

    <!-- FLOATING ADMIN CONTROLS -->
    <div class="fixed top-6 right-6 z-50 flex items-center gap-3">
        <button id="loginBtn" onclick="toggle('loginModal')" class="bg-white/90 backdrop-blur px-5 py-2 rounded-full font-bold shadow-lg border border-slate-200 text-slate-700">
            <i class="fas fa-user-shield mr-2"></i>Admin
        </button>
        <div id="adminTools" class="hidden flex gap-2">
            <button onclick="saveHero()" class="bg-indigo-600 text-white px-5 py-2 rounded-full font-bold shadow-lg hover:bg-indigo-700">
                <i class="fas fa-save mr-2"></i>Save Header
            </button>
            <button onclick="logout()" class="bg-slate-800 text-white p-2.5 rounded-full shadow-lg">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <!-- HERO -->
    <header class="max-w-7xl mx-auto px-10 pt-24 pb-20 flex flex-col lg:flex-row items-center">
        <div class="lg:w-1/2 space-y-8">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl"><i class="fas fa-graduation-cap text-white"></i></div>
                <span class="text-xl font-black text-slate-900 tracking-tight">YOUR LEARNING SITE</span>
            </div>
            <h1 class="text-6xl font-extrabold text-slate-900 leading-tight">
                <span id="txt-blue" class="text-indigo-600">Smart Study</span><br>
                <span id="txt-black">Resources</span>
            </h1>
            <p id="txt-desc" class="text-slate-500 text-xl max-w-lg">Access your video lectures and class notes anytime, anywhere.</p>
            <a href="#hub" class="inline-block bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100">Browse Lessons <i class="fas fa-arrow-down ml-2"></i></a>
        </div>
        <div class="lg:w-1/2 flex justify-center">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=600&q=80" class="rounded-[3rem] w-full max-w-md shadow-2xl border-[12px] border-white">
        </div>
    </header>

    <!-- STUDY HUB -->
    <section id="hub" class="max-w-7xl mx-auto px-10 py-10">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
            <div>
                <h2 class="text-4xl font-extrabold text-slate-900">Learning Library</h2>
                <p class="text-slate-500">Video lectures and study materials curated for you</p>
            </div>
            <button id="addResourceBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg hover:scale-105 transition">
                <i class="fas fa-plus mr-2"></i>Add Resource
            </button>
        </div>

        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Dynamic Content -->
        </div>
    </section>

    <!-- VIDEO PLAYER MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/90 z-[200] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-10 right-10 text-white text-4xl"><i class="fas fa-times"></i></button>
        <div class="w-full max-w-5xl aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl">
            <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <h2 id="videoModalTitle" class="text-white text-2xl font-bold mt-6"></h2>
    </div>

    <!-- MODAL: ADD RESOURCE -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-lg mx-4">
            <h2 class="text-3xl font-bold mb-6 text-slate-900">New Material</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Lesson Title" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <select id="resType" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                    <option value="video">YouTube Video</option>
                    <option value="note">Class Notes (PDF/Link)</option>
                </select>
                <input type="text" id="resUrl" placeholder="Link (YouTube URL or Note Link)" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <textarea id="resDesc" placeholder="Brief explanation..." class="w-full p-4 bg-slate-50 border rounded-xl outline-none h-24"></textarea>
                <div class="flex gap-4 pt-4">
                    <button onclick="toggle('resourceModal')" class="flex-1 bg-slate-100 text-slate-600 py-4 rounded-xl font-bold">Cancel</button>
                    <button onclick="addNewResource()" class="flex-2 bg-indigo-600 text-white py-4 px-8 rounded-xl font-bold shadow-lg">Add to Library</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-xl mb-4 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-xl mb-6 outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg">Login</button>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site",
            storageBucket: "your-learning-site.firebasestorage.app",
            messagingSenderId: "150311153752",
            appId: "1:150311153752:web:50d999325bc866865bda2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- UTILITIES ---
        function getYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        window.playVideo = (url, title) => {
            const id = getYTId(url);
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('videoModalTitle').innerText = title;
            document.getElementById('videoModal').classList.remove('hidden');
        };

        window.closeVideo = () => {
            document.getElementById('videoFrame').src = "";
            document.getElementById('videoModal').classList.add('hidden');
        };

        // --- CORE ACTIONS ---
        onSnapshot(collection(db, "resources"), (snapshot) => {
            const grid = document.getElementById('resourceGrid');
            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const res = doc.data();
                const isAdmin = auth.currentUser ? '' : 'hidden';
                
                if(res.type === 'video') {
                    const ytId = getYTId(res.url);
                    grid.innerHTML += `
                        <div class="glass-card rounded-[2.5rem] overflow-hidden shadow-sm hover:shadow-2xl transition-all group">
                            <div class="relative video-thumbnail cursor-pointer aspect-video bg-slate-900" onclick="playVideo('${res.url}', '${res.title}')">
                                <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition">
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <div class="bg-white/20 backdrop-blur-md w-16 h-16 rounded-full flex items-center justify-center text-white text-2xl border border-white/30 group-hover:scale-110 transition">
                                        <i class="fas fa-play ml-1"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="p-8">
                                <h3 class="text-xl font-bold text-slate-900 mb-2">${res.title}</h3>
                                <p class="text-slate-500 text-sm mb-6 line-clamp-2">${res.desc}</p>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold uppercase tracking-widest text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full">Video Lecture</span>
                                    <button onclick="deleteDoc(doc(db, 'resources', '${doc.id}'))" class="${isAdmin} text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    grid.innerHTML += `
                        <div class="glass-card p-8 rounded-[2.5rem] shadow-sm hover:shadow-2xl transition-all relative">
                            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-3xl mb-6">
                                <i class="fas fa-file-pdf"></i>
                            </div>
                            <h3 class="text-xl font-bold text-slate-900 mb-2">${res.title}</h3>
                            <p class="text-slate-500 text-sm mb-8">${res.desc}</p>
                            <div class="flex justify-between items-center">
                                <a href="${res.url}" target="_blank" class="bg-slate-900 text-white px-6 py-2 rounded-full text-sm font-bold">Download Notes</a>
                                <button onclick="deleteDoc(doc(db, 'resources', '${doc.id}'))" class="${isAdmin} text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
            });
        });

        window.addNewResource = async () => {
            const title = document.getElementById('resTitle').value;
            const type = document.getElementById('resType').value;
            const url = document.getElementById('resUrl').value;
            const desc = document.getElementById('resDesc').value;
            if(!title || !url) return alert("Fill in title and URL");
            await addDoc(collection(db, "resources"), { title, type, url, desc });
            toggle('resourceModal');
        };

        // --- AUTH & HERO ---
        window.handleLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                toggle('loginModal');
            } catch (e) { alert(e.message); }
        };
        window.logout = () => signOut(auth);
        window.saveHero = async () => {
            await setDoc(doc(db, "siteData", "hero"), {
                blue: document.getElementById('txt-blue').innerText,
                black: document.getElementById('txt-black').innerText,
                desc: document.getElementById('txt-desc').innerText
            });
            alert("Header updated!");
        };

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminTools').classList.toggle('hidden', !isAdm);
            document.getElementById('addResourceBtn').classList.toggle('hidden', !isAdm);
            ['txt-blue', 'txt-black', 'txt-desc'].forEach(id => {
                const el = document.getElementById(id);
                el.contentEditable = isAdm;
                isAdm ? el.classList.add('editing-mode') : el.classList.remove('editing-mode');
            });
        });

        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');

        // Load Initial Hero Data
        const hSnap = await getDoc(doc(db, "siteData", "hero"));
        if(hSnap.exists()) {
            document.getElementById('txt-blue').innerText = hSnap.data().blue;
            document.getElementById('txt-black').innerText = hSnap.data().black;
            document.getElementById('txt-desc').innerText = hSnap.data().desc;
        }
    </script>
</body>
</html>
