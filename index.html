<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPK TUTORIALS - Educational Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: -1px; }
        .dpk-red { color: #FF0000; }
        .tut-blue { color: #0000FF; }
        .subtitle-green { color: #4ade80; font-size: 8px; font-weight: 800; letter-spacing: 2px; }
        .glass-nav { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); transition: transform 0.4s; position: fixed; top: 0; width: 100%; z-index: 100; }
        .nav-hidden { transform: translateY(-100%); }
        .slider-wrap { position: relative; width: 100%; height: 45vh; overflow: hidden; background: #0f172a; margin-top: 80px; }
        @media (min-width: 1024px) { .slider-wrap { height: 70vh; margin-top: 88px; } }
        .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; }
        .slide.active { opacity: 1; }
        .card-entry { animation: cardSlideUp 0.6s ease-out forwards; opacity: 0; }
        @keyframes cardSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .thumb-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 2rem 2rem 0 0; background: #f1f5f9; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .note-cover { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .bg-pdf { background: linear-gradient(135deg, #e52d27, #b31919); } 
        .bg-doc { background: linear-gradient(135deg, #f7d02c, #d1a600); } 
        .bg-ppt { background: linear-gradient(135deg, #27ae60, #1e8449); } 
        .bg-sim { background: linear-gradient(135deg, #8b5cf6, #4c1d95); }
        .sim-container { width: 95%; height: 90%; background: white; border-radius: 2rem; overflow: hidden; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen">

    <!-- NAV -->
    <nav id="mainNav" class="glass-nav border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
            <div class="flex flex-col cursor-pointer" onclick="filterType('all')">
                <div class="flex items-center brand-font text-2xl lg:text-3xl">
                    <span class="dpk-red">DPK</span> <span class="tut-blue ml-2 uppercase">TUTORIALS</span>
                </div>
                <div class="subtitle-green uppercase">Out and Out Educational Site</div>
            </div>
            <div class="hidden md:flex items-center gap-6 font-bold text-slate-500 text-[10px] uppercase">
                <button onclick="filterType('all')">Home</button>
                <button onclick="filterType('video')">Videos</button>
                <button onclick="filterType('note')">Notes</button>
                <button onclick="filterType('sim')">Simulations</button>
            </div>
            <div class="flex gap-3">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-[10px] font-bold border px-4 py-2 rounded-full uppercase">Admin</button>
                <div id="adminPanel" class="hidden flex gap-2">
                    <button onclick="toggle('imageModal')" class="bg-indigo-600 text-white text-[10px] px-5 py-2 rounded-full font-bold">SLIDES</button>
                    <button onclick="logout()" class="text-red-500"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- SLIDER -->
    <div class="slider-wrap"><div id="slider"></div></div>

    <!-- HUB -->
    <main class="max-w-7xl mx-auto px-6 py-16">
        <div class="flex flex-col md:flex-row items-center justify-between mb-12 gap-6">
            <h2 id="hubTitle" class="text-4xl font-black text-slate-900">Resource Hub</h2>
            <div class="flex gap-4 w-full md:w-auto">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search..." class="bg-white border rounded-2xl px-6 py-3 w-full md:w-64 outline-none">
                <button id="addResBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold">Add</button>
            </div>
        </div>
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#001b3a] text-white py-16 text-center">
        <p class="text-xl font-bold">© <span id="year"></span> DPK TUTORIALS</p>
        <p class="text-slate-400 text-xs mt-2 uppercase tracking-widest">Designed by Deepak Prakash Bhatta</p>
    </footer>

    <!-- CONTENT VIEWER -->
    <div id="contentModal" onclick="handleOutsideClick(event)" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeContent()" class="absolute top-6 right-6 text-white text-5xl hover:text-red-500">&times;</button>
        <div id="modalBody" class="sim-container">
            <iframe id="cFrame" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- MODAL: ADD -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4 overflow-y-auto">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md relative">
            <h2 class="text-2xl font-bold mb-6">Publish Content</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Title" class="w-full p-4 border rounded-xl outline-none">
                <div class="flex gap-2">
                    <select id="resType" class="border rounded-xl p-4" onchange="updateForm(this.value)">
                        <option value="video">Video</option>
                        <option value="note">Note</option>
                        <option value="sim">Simulation</option>
                    </select>
                    <input type="text" id="resLevel" placeholder="Level" class="flex-1 p-4 border rounded-xl">
                </div>
                <div id="htmlPasteBox" class="hidden">
                    <textarea id="resHtmlContent" placeholder="Paste HTML code here..." class="w-full p-4 border rounded-xl h-32 text-xs font-mono"></textarea>
                </div>
                <div id="autoThumbBox" class="hidden p-4 bg-slate-50 rounded-xl border-2 border-dashed">
                    <input type="file" id="resFile" accept=".pdf,.html,.htm,image/*" class="text-xs">
                </div>
                <input type="text" id="resUrl" placeholder="URL (YouTube/Drive)" class="w-full p-4 border rounded-xl">
                <textarea id="resDesc" placeholder="Description" class="w-full p-4 border rounded-xl h-20"></textarea>
                <button onclick="addMaterial()" id="publishBtn" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">PUBLISH</button>
                <button onclick="toggle('resourceModal')" class="w-full text-slate-400 text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ADMIN MODALS -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[2rem] w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 border rounded-xl mb-4">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 border rounded-xl mb-6">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">Enter</button>
        </div>
    </div>

    <div id="imageModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-lg flex flex-col max-h-[80vh]">
            <h2 class="text-xl font-bold mb-4">Slider</h2>
            <input type="file" id="fileInp" accept="image/*" class="mb-4">
            <button onclick="savePhoto()" id="upBtn" class="bg-indigo-600 text-white py-3 rounded-xl font-bold">Upload</button>
            <div id="photoList" class="overflow-y-auto mt-4 space-y-2"></div>
            <button onclick="toggle('imageModal')" class="mt-4 text-slate-400">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, collection, addDoc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk", authDomain: "your-learning-site.firebaseapp.com", projectId: "your-learning-site" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        document.getElementById('year').innerText = new Date().getFullYear();

        window.updateForm = (val) => {
            document.getElementById('autoThumbBox').classList.toggle('hidden', val === 'video');
            document.getElementById('htmlPasteBox').classList.toggle('hidden', val !== 'sim');
        };

        // --- GLOBAL DELETE FUNCTION ---
        window.delItem = async (col, id) => {
            if(confirm("Are you sure you want to delete this?")) {
                try {
                    await deleteDoc(doc(db, col, id));
                } catch (e) { alert("Error deleting: " + e.message); }
            }
        };

        // --- CONTENT LOADER ---
        let rawRes = []; let filter = 'all';
        onSnapshot(collection(db, "resources"), (snap) => { rawRes = snap.docs.map(d => ({id: d.id, ...d.data()})); draw(); });

        window.draw = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            const isAdmin = auth.currentUser ? '' : 'hidden';

            grid.innerHTML = rawRes.filter(m => (filter === 'all' || m.type === filter) && m.title.toLowerCase().includes(q)).map(m => {
                let thumb = '';
                if(m.type === 'video') {
                    const ytId = m.url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
                    thumb = `<div class="thumb-wrap cursor-pointer" onclick="viewContent('${m.url}', 'video', '${m.title}', ${m.isRaw})"><img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" class="thumb-img"><div class="absolute inset-0 flex items-center justify-center bg-black/20"><i class="fas fa-play text-white text-3xl"></i></div></div>`;
                } else {
                    let style = m.type === 'sim' ? 'bg-sim' : 'bg-gen';
                    const t = m.title.toLowerCase();
                    if(t.includes('pdf')) style = 'bg-pdf'; else if(t.includes('doc')) style = 'bg-doc'; else if(t.includes('ppt')) style = 'bg-ppt';
                    thumb = `<div class="thumb-wrap">` + (m.thumb ? `<img src="${m.thumb}" class="thumb-img">` : `<div class="note-cover ${style} font-bold uppercase text-xs">Resource</div>`) + `</div>`;
                }

                return `<div class="card-entry bg-white rounded-[2rem] shadow-lg overflow-hidden flex flex-col h-full border">
                    ${thumb}
                    <div class="p-6 flex flex-col flex-grow">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">${m.level}</span>
                        <h3 class="font-bold text-slate-900 mb-2">${m.title}</h3>
                        <p class="text-xs text-slate-500 mb-6 line-clamp-2">${m.desc}</p>
                        <div class="mt-auto flex justify-between items-center">
                            ${m.type==='note' ? `<a href="${m.url}" target="_blank" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-[10px] font-bold">Open</a>` : `<button onclick="viewContent(\`${m.url}\`, '${m.type}', '${m.title}', ${m.isRaw})" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-[10px] font-bold uppercase">Open ${m.type}</button>`}
                            <button onclick="delItem('resources', '${m.id}')" class="${isAdmin} text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        window.addMaterial = async () => {
            const btn = document.getElementById('publishBtn'); btn.innerText = "Processing..."; btn.disabled = true;
            const type = document.getElementById('resType').value; const title = document.getElementById('resTitle').value;
            const level = document.getElementById('resLevel').value; const desc = document.getElementById('resDesc').value;
            const file = document.getElementById('resFile').files[0]; const pastedHtml = document.getElementById('resHtmlContent').value;
            let url = document.getElementById('resUrl').value; let thumbData = null; let isRaw = false;

            if (type === 'sim' && pastedHtml.trim() !== "") { url = pastedHtml; isRaw = true; }
            if (file) {
                const reader = new FileReader();
                const data = await new Promise((res) => { reader.onload = () => res(reader.result); if (file.name.endsWith('.html')) reader.readAsText(file); else reader.readAsArrayBuffer(file); });
                if (file.name.endsWith('.html')) { url = data; isRaw = true; }
                else if (file.type === "application/pdf") {
                    const pdf = await pdfjsLib.getDocument({ data }).promise;
                    const page = await pdf.getPage(1); const vp = page.getViewport({ scale: 1 });
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.height = vp.height; canvas.width = vp.width;
                    await page.render({ canvasContext: ctx, viewport: vp }).promise; thumbData = canvas.toDataURL('image/jpeg', 0.8);
                }
            }
            await addDoc(collection(db, "resources"), { title, type, level, url, desc, thumb: thumbData, isRaw });
            toggle('resourceModal'); btn.innerText = "PUBLISH"; btn.disabled = false;
        };

        window.viewContent = (url, type, title, isRaw) => {
            const frame = document.getElementById('cFrame');
            frame.src = ""; frame.srcdoc = ""; // CLEAN FRAME
            if (isRaw === true) { frame.srcdoc = url; } 
            else if (type === 'video') {
                const id = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
                frame.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            } else { frame.src = url; }
            document.getElementById('contentModal').classList.remove('hidden');
        };

        window.closeContent = () => { document.getElementById('cFrame').src = ""; document.getElementById('cFrame').srcdoc = ""; document.getElementById('contentModal').classList.add('hidden'); };
        window.handleOutsideClick = (e) => { if(e.target.id === 'contentModal') closeContent(); };
        window.handleSearch = () => draw();
        window.filterType = (t) => { filter = t; document.getElementById('hubTitle').innerText = t==='all'?'Hub':t.toUpperCase(); draw(); };
        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');
        window.handleLogin = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); toggle('loginModal'); } catch (e) { alert("Fail"); } };
        window.logout = () => signOut(auth);

        // SLIDER & NAV
        let lastScroll = window.scrollY;
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > lastScroll && window.scrollY > 200) nav.classList.add('nav-hidden');
            else nav.classList.remove('nav-hidden');
            lastScroll = window.scrollY;
        });

        onSnapshot(query(collection(db, "slideshow"), orderBy("createdAt", "desc")), (snap) => {
            const slider = document.getElementById('slider'); const list = document.getElementById('photoList');
            const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
            if(data.length > 0) {
                slider.innerHTML = data.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = data.map(s => `<div class="flex items-center gap-3 p-2 bg-slate-50 rounded-lg"><img src="${s.url}" class="w-10 h-6 object-cover"><button onclick="delItem('slideshow', '${s.id}')" class="ml-auto text-red-400 text-[10px]">Delete</button></div>`).join('');
                let cur = 0; setInterval(() => { const els = document.querySelectorAll('.slide'); if(els.length < 2) return; els[cur].classList.remove('active'); cur = (cur + 1) % els.length; els[cur].classList.add('active'); }, 6000);
            }
        });

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user; document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminPanel').classList.toggle('hidden', !isAdm);
            document.getElementById('addResBtn').classList.toggle('hidden', !isAdm); draw();
        });
    </script>
</body>
</html>
