<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Bhatta Sir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .slider-wrap { position: relative; width: 100%; height: 70vh; overflow: hidden; background: #0f172a; }
        .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; }
        .slide.active { opacity: 1; }
        .slider-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: linear-gradient(to top, #f8fafc, transparent); z-index: 10; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-[100] glass-nav border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-lg"><i class="fas fa-graduation-cap text-white"></i></div>
                <span class="font-extrabold text-slate-900 text-xl tracking-tighter">YOUR LEARNING SITE</span>
            </div>
            <div class="hidden md:flex items-center gap-8 font-bold text-slate-500 text-xs uppercase tracking-widest">
                <button onclick="filterType('all')" class="hover:text-indigo-600">Home</button>
                <button onclick="filterType('video')" class="hover:text-indigo-600">Videos</button>
                <button onclick="filterType('note')" class="hover:text-indigo-600">Notes</button>
            </div>
            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-[10px] font-black text-slate-400 border px-4 py-2 rounded-full uppercase">Admin</button>
                <div id="adminPanel" class="hidden flex items-center gap-3">
                    <button onclick="toggle('imageModal')" class="bg-indigo-600 text-white text-[10px] px-5 py-2.5 rounded-full font-black uppercase">Manage Slides</button>
                    <button onclick="logout()" class="text-red-500 bg-white border p-2 rounded-full shadow-sm"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- FULL WIDTH HERO SLIDER -->
    <div class="slider-wrap">
        <div id="slider">
            <div class="absolute inset-0 flex items-center justify-center text-slate-400 bg-slate-100 font-bold uppercase tracking-widest text-xs">
                <i class="fas fa-spinner fa-spin mr-3"></i> Loading Classroom Gallery...
            </div>
        </div>
        <div class="slider-overlay"></div>
    </div>

    <!-- MAIN CONTENT HUB -->
    <main class="max-w-7xl mx-auto px-6 py-16 flex-grow w-full">
        <div class="flex flex-col md:flex-row items-center justify-between mb-16 gap-8">
            <div class="text-center md:text-left">
                <h2 id="hubTitle" class="text-4xl font-extrabold text-slate-900 tracking-tight">Resource Hub</h2>
                <p class="text-slate-400 font-medium mt-1">Academic materials by Bhatta Sir</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <div class="flex items-center bg-white px-5 py-3 rounded-2xl border border-slate-100 shadow-sm w-full md:w-80">
                    <i class="fas fa-search text-slate-300 mr-3"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search library..." class="bg-transparent outline-none text-sm w-full font-medium">
                </div>
                <button id="addResBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100 whitespace-nowrap">
                    <i class="fas fa-plus-circle mr-2"></i> Add Content
                </button>
            </div>
        </div>
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <!-- NAVY BLUE FOOTER -->
    <footer class="bg-[#001b3a] text-white py-16">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="bg-indigo-600 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-2xl">
                <i class="fas fa-graduation-cap text-white text-2xl"></i>
            </div>
            <p class="text-xl font-bold mb-2">© <span id="year"></span> Bhatta Sir. All Rights Reserved.</p>
            <p class="text-slate-400 text-sm font-medium uppercase tracking-widest">Designed by <span class="text-indigo-400">Deepak Prakash Bhatta</span></p>
        </div>
    </footer>

    <!-- MODAL: LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm relative">
            <button onclick="toggle('loginModal')" class="absolute top-6 right-6 text-slate-300 hover:text-red-500 text-2xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-3xl font-black text-slate-900 mb-8">Admin</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-2xl mb-8 outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">Access Dashboard</button>
        </div>
    </div>

    <!-- MODAL: SLIDE MANAGER (Stores as compressed text in Firestore) -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-lg relative max-h-[85vh] flex flex-col">
            <button onclick="toggle('imageModal')" class="absolute top-6 right-6 text-slate-300 text-2xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-2xl font-bold mb-6">Slider Manager</h2>
            <div class="mb-8 p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center">
                <input type="file" id="fileInp" accept="image/*" class="text-xs w-full mb-4">
                <button onclick="savePhoto()" id="upBtn" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg">Save to Gallery</button>
                <p class="text-[10px] text-slate-400 mt-2 font-bold uppercase">Auto-optimized for free hosting</p>
            </div>
            <div id="photoList" class="flex-grow overflow-y-auto space-y-4 pr-2"></div>
        </div>
    </div>

    <!-- MODAL: ADD RESOURCE -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md relative">
            <button onclick="toggle('resourceModal')" class="absolute top-6 right-6 text-slate-300 text-2xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-2xl font-bold mb-6">New Content</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Title" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                <div class="flex gap-4">
                    <select id="resType" class="border rounded-2xl p-4 bg-slate-50 font-bold text-slate-500 outline-none"><option value="video">Video</option><option value="note">Note</option></select>
                    <input type="text" id="resLevel" placeholder="Class/Level" class="flex-1 p-4 border rounded-2xl bg-slate-50 outline-none">
                </div>
                <input type="text" id="resUrl" placeholder="Link" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                <textarea id="resDesc" placeholder="Brief info..." class="w-full p-4 border rounded-2xl bg-slate-50 outline-none h-24"></textarea>
                <button onclick="addMaterial()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl">Publish to Hub</button>
            </div>
        </div>
    </div>

    <!-- VIDEO MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-8 right-8 text-white/50 text-4xl hover:text-white"><i class="fas fa-times-circle"></i></button>
        <iframe id="vFrame" class="w-full max-w-5xl aspect-video rounded-3xl" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG (NO STORAGE BUCKET NEEDED TO PREVENT CORS)
        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('year').innerText = new Date().getFullYear();

        // --- IMPROVED IMAGE COMPRESSION + UPLOAD ---
        window.savePhoto = () => {
            const file = document.getElementById('fileInp').files[0];
            if(!file) return alert("Please select a photo first");
            const btn = document.getElementById('upBtn');
            btn.innerText = "OPTIMIZING..."; btn.disabled = true;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async () => {
                    // Create Canvas to resize and compress
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // Convert to high-quality compressed JPEG (0.7 quality)
                    const base64 = canvas.toDataURL('image/jpeg', 0.7);

                    try {
                        await addDoc(collection(db, "slideshow"), { 
                            url: base64, 
                            createdAt: Date.now() 
                        });
                        alert("Classroom photo added!");
                    } catch (err) { alert("Error: " + err.message); }
                    btn.innerText = "Save to Gallery"; btn.disabled = false;
                    document.getElementById('fileInp').value = "";
                };
            };
        };

        // --- SLIDER ENGINE ---
        let slides = []; let curIdx = 0; let timer;
        onSnapshot(query(collection(db, "slideshow"), orderBy("createdAt", "desc")), (snap) => {
            slides = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const slider = document.getElementById('slider');
            const list = document.getElementById('photoList');
            if(slides.length > 0) {
                slider.innerHTML = slides.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = slides.map(s => `<div class="flex items-center gap-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <img src="${s.url}" class="w-16 h-10 object-cover rounded-lg shadow-sm">
                    <button onclick="deleteDoc(doc(db, 'slideshow', '${s.id}'))" class="ml-auto text-red-500 font-bold text-xs uppercase tracking-tighter">Remove</button>
                </div>`).join('');
                if(timer) clearInterval(timer);
                if(slides.length > 1) timer = setInterval(() => {
                    const els = document.querySelectorAll('.slide');
                    if(!els[curIdx]) return;
                    els[curIdx].classList.remove('active');
                    curIdx = (curIdx + 1) % els.length;
                    els[curIdx].classList.add('active');
                }, 5000);
            } else {
                slider.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-slate-300 font-bold uppercase tracking-widest bg-slate-50">Upload Classroom Photos as Admin</div>`;
            }
        });

        // --- CONTENT LOGIC ---
        let rawRes = []; let filter = 'all';
        onSnapshot(collection(db, "resources"), (snap) => { rawRes = snap.docs.map(d => ({id: d.id, ...d.data()})); draw(); });

        window.filterType = (t) => { 
            filter = t; 
            document.getElementById('hubTitle').innerText = t === 'all' ? 'Resource Hub' : (t === 'video' ? 'Video Lectures' : 'Study Notes');
            draw(); 
        };
        window.handleSearch = () => draw();

        const draw = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            const isAdmin = auth.currentUser ? '' : 'hidden';
            grid.innerHTML = rawRes.filter(m => (filter === 'all' || m.type === filter) && m.title.toLowerCase().includes(q)).map(m => `
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 hover:shadow-2xl transition-all duration-300">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-12 h-12 ${m.type==='video'?'bg-red-50 text-red-500':'bg-indigo-50 text-indigo-600'} rounded-2xl flex items-center justify-center shadow-inner">
                            <i class="fas ${m.type==='video'?'fa-play':'fa-file-pdf'}"></i>
                        </div>
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest pt-2">${m.level}</span>
                    </div>
                    <h3 class="text-xl font-extrabold text-slate-900 mb-2">${m.title}</h3>
                    <p class="text-slate-400 text-sm mb-10 line-clamp-2">${m.desc}</p>
                    <div class="flex justify-between items-center pt-6 border-t border-slate-50">
                        ${m.type === 'video' ? `<button onclick="viewVideo('${m.url}')" class="text-indigo-600 font-bold hover:translate-x-1 transition">Watch Lesson</button>` : `<a href="${m.url}" target="_blank" class="text-slate-900 font-bold">Open Notes</a>`}
                        <button onclick="delRes('${m.id}')" class="${isAdmin} text-red-300 hover:text-red-600"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        };

        window.delRes = (id) => confirm("Delete this?") && deleteDoc(doc(db, "resources", id));
        window.addMaterial = async () => {
            await addDoc(collection(db, "resources"), { 
                title: document.getElementById('resTitle').value, type: document.getElementById('resType').value, 
                level: document.getElementById('resLevel').value, url: document.getElementById('resUrl').value, 
                desc: document.getElementById('resDesc').value 
            });
            toggle('resourceModal');
        };

        window.viewVideo = (url) => {
            const id = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
            document.getElementById('vFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            toggle('videoModal');
        };
        window.closeVideo = () => { document.getElementById('vFrame').src = ""; toggle('videoModal'); };

        // --- AUTH ---
        window.handleLogin = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); toggle('loginModal'); } catch (e) { alert("Login failed"); } };
        window.logout = () => signOut(auth);
        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminPanel').classList.toggle('hidden', !isAdm);
            document.getElementById('addResBtn').classList.toggle('hidden', !isAdm);
            draw();
        });
        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');
    </script>
</body>
</html>
