<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Bhatta Sir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        
        /* NAVIGATION LOGIC */
        .glass-nav { 
            background: rgba(255, 255, 255, 0.96); 
            backdrop-filter: blur(12px); 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: fixed; top: 0; width: 100%; z-index: 100;
        }
        .nav-hidden { transform: translateY(-100%); }

        /* SLIDER LOGIC */
        .slider-wrap { 
            position: relative; width: 100%; height: 45vh; 
            overflow: hidden; background: #0f172a; margin-top: 72px; 
        }
        @media (min-width: 1024px) { .slider-wrap { height: 75vh; margin-top: 80px; } }
        .slide { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; object-position: center; 
            opacity: 0; transition: opacity 1.5s ease-in-out; 
        }
        .slide.active { opacity: 1; }
        .slider-overlay { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 120px; 
            background: linear-gradient(to top, #f8fafc, transparent); z-index: 10; 
        }

        /* CARD ANIMATIONS */
        .note-float { animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .card-entry { animation: cardSlideUp 0.6s ease-out forwards; opacity: 0; }
        @keyframes cardSlideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .video-overlay:hover .play-btn { transform: scale(1.1); background: #4f46e5; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex flex-col">

    <!-- SMART NAV BAR -->
    <nav id="mainNav" class="glass-nav border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg"><i class="fas fa-graduation-cap text-white text-lg"></i></div>
                <span class="font-extrabold text-slate-900 text-xl tracking-tighter uppercase">YOUR LEARNING SITE</span>
            </div>
            <div class="hidden md:flex items-center gap-10 font-bold text-slate-500 text-xs uppercase tracking-[0.2em]">
                <button onclick="filterType('all')" class="hover:text-indigo-600 transition">Home</button>
                <button onclick="filterType('video')" class="hover:text-indigo-600 transition">Videos</button>
                <button onclick="filterType('note')" class="hover:text-indigo-600 transition">Notes</button>
            </div>
            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-[10px] font-black text-slate-400 border px-5 py-2.5 rounded-full uppercase hover:bg-slate-50">Admin</button>
                <div id="adminPanel" class="hidden flex items-center gap-3">
                    <button onclick="toggle('imageModal')" class="bg-indigo-600 text-white text-[10px] px-6 py-3 rounded-full font-black uppercase shadow-lg">Manage Slider</button>
                    <button onclick="logout()" class="text-red-500 bg-white border p-2.5 rounded-full shadow-sm hover:bg-red-50"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO SLIDER -->
    <div class="slider-wrap shadow-2xl">
        <div id="slider">
            <div class="absolute inset-0 flex items-center justify-center text-slate-400 bg-slate-900 font-bold uppercase tracking-widest text-xs">
                <i class="fas fa-circle-notch fa-spin mr-3"></i> Syncing Classroom Media...
            </div>
        </div>
        <div class="slider-overlay"></div>
    </div>

    <!-- MAIN HUB -->
    <main class="max-w-7xl mx-auto px-6 py-16 flex-grow w-full">
        <div class="flex flex-col md:flex-row items-center justify-between mb-20 gap-10">
            <div class="text-center md:text-left">
                <h2 id="hubTitle" class="text-5xl font-black text-slate-900 tracking-tight">Resource Hub</h2>
                <div class="h-1.5 w-24 bg-indigo-600 rounded-full mt-4 mx-auto md:mx-0 shadow-lg"></div>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <div class="flex items-center bg-white px-6 py-4 rounded-3xl border border-slate-100 shadow-xl w-full md:w-96 focus-within:ring-2 ring-indigo-100 transition">
                    <i class="fas fa-search text-slate-300 mr-4"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search videos or notes..." class="bg-transparent outline-none text-sm w-full font-semibold text-slate-600">
                </div>
                <button id="addResBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-10 py-4 rounded-3xl font-extrabold shadow-2xl shadow-indigo-200 hover:scale-105 transition">
                    <i class="fas fa-plus mr-2"></i> Add Content
                </button>
            </div>
        </div>

        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- NAVY FOOTER -->
    <footer class="bg-[#001b3a] text-white py-20">
        <div class="max-w-7xl mx-auto px-10 text-center">
            <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-10 shadow-3xl">
                <i class="fas fa-graduation-cap text-white text-3xl"></i>
            </div>
            <p class="text-2xl font-bold mb-4 tracking-tight uppercase">© <span id="year"></span> Bhatta Sir Portal</p>
            <p class="text-slate-400 text-sm font-medium uppercase tracking-[0.3em]">Designed by <span class="text-indigo-400 font-black">Deepak Prakash Bhatta</span></p>
        </div>
    </footer>

    <!-- VIDEO MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/98 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-8 right-8 text-white/40 text-5xl hover:text-red-500 transition"><i class="fas fa-times-circle"></i></button>
        <div class="w-full max-w-5xl aspect-video rounded-3xl overflow-hidden shadow-2xl border-4 border-white/10">
            <iframe id="vFrame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- MODAL: LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-12 rounded-[3rem] shadow-2xl w-full max-w-sm relative">
            <button onclick="toggle('loginModal')" class="absolute top-8 right-8 text-slate-300 hover:text-red-500 transition text-3xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-4xl font-black text-slate-900 mb-10 text-center">Admin</h2>
            <div class="space-y-6">
                <input type="email" id="email" placeholder="Email Address" class="w-full p-5 bg-slate-50 border rounded-3xl outline-none focus:ring-2 ring-indigo-500/20">
                <input type="password" id="password" placeholder="Password" class="w-full p-5 bg-slate-50 border rounded-3xl outline-none focus:ring-2 ring-indigo-500/20">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-5 rounded-3xl font-black shadow-2xl shadow-indigo-200 mt-6 text-lg tracking-widest">LOGIN</button>
            </div>
        </div>
    </div>

    <!-- MODAL: IMAGE MANAGER -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-lg relative max-h-[85vh] flex flex-col">
            <button onclick="toggle('imageModal')" class="absolute top-8 right-8 text-slate-300 text-3xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-2xl font-bold mb-8 text-slate-900">Gallery Manager</h2>
            <div class="mb-10 p-8 bg-indigo-50 rounded-[2rem] border-2 border-dashed border-indigo-200 text-center">
                <input type="file" id="fileInp" accept="image/*" class="text-xs w-full mb-6 cursor-pointer">
                <button onclick="savePhoto()" id="upBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl">Upload to Slider</button>
            </div>
            <div id="photoList" class="flex-grow overflow-y-auto space-y-4 pr-3"></div>
        </div>
    </div>

    <!-- MODAL: ADD RESOURCE -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-12 rounded-[3rem] shadow-2xl w-full max-w-md relative">
            <button onclick="toggle('resourceModal')" class="absolute top-8 right-8 text-slate-300 text-3xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-3xl font-black mb-8 text-slate-900">Post Material</h2>
            <div class="space-y-5">
                <input type="text" id="resTitle" placeholder="Title of Lesson" class="w-full p-5 border rounded-2xl bg-slate-50 outline-none">
                <div class="flex gap-4">
                    <select id="resType" class="border rounded-2xl p-5 bg-white font-bold text-slate-600 outline-none shadow-sm"><option value="video">Video</option><option value="note">Note</option></select>
                    <input type="text" id="resLevel" placeholder="Level (Grade 10, etc)" class="flex-1 p-5 border rounded-2xl bg-slate-50 outline-none">
                </div>
                <input type="text" id="resUrl" placeholder="Paste URL (YouTube/Drive)" class="w-full p-5 border rounded-2xl bg-slate-50 outline-none">
                <textarea id="resDesc" placeholder="Brief Description..." class="w-full p-5 border rounded-2xl bg-slate-50 outline-none h-28"></textarea>
                <button onclick="addMaterial()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-2xl shadow-indigo-100 text-lg">PUBLISH CONTENT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('year').innerText = new Date().getFullYear();

        // --- SMART NAV HIDE ---
        let lastScroll = window.scrollY;
        const nav = document.getElementById('mainNav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > lastScroll && window.scrollY > 200) nav.classList.add('nav-hidden');
            else nav.classList.remove('nav-hidden');
            lastScroll = window.scrollY;
        });

        // --- IMAGE COMPRESSION & SAVE ---
        window.savePhoto = () => {
            const file = document.getElementById('fileInp').files[0];
            if(!file) return alert("Select a file first");
            const btn = document.getElementById('upBtn');
            btn.innerText = "PROCESSING..."; btn.disabled = true;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1920; 
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.85);
                    try {
                        await addDoc(collection(db, "slideshow"), { url: base64, createdAt: Date.now() });
                        alert("Gallery Updated!");
                    } catch (err) { alert(err.message); }
                    btn.innerText = "Upload to Slider"; btn.disabled = false;
                    document.getElementById('fileInp').value = "";
                };
            };
        };

        // --- GALLERY ENGINE ---
        let slides = []; let curIdx = 0; let timer;
        onSnapshot(query(collection(db, "slideshow"), orderBy("createdAt", "desc")), (snap) => {
            slides = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const slider = document.getElementById('slider');
            const list = document.getElementById('photoList');
            if(slides.length > 0) {
                slider.innerHTML = slides.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = slides.map(s => `<div class="flex items-center gap-5 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <img src="${s.url}" class="w-20 h-12 object-cover rounded-xl shadow-md">
                    <button onclick="deleteDoc(doc(db, 'slideshow', '${s.id}'))" class="ml-auto text-red-500 font-bold text-xs uppercase tracking-widest">Delete</button>
                </div>`).join('');
                if(timer) clearInterval(timer);
                if(slides.length > 1) timer = setInterval(() => {
                    const els = document.querySelectorAll('.slide');
                    if(!els[curIdx]) return;
                    els[curIdx].classList.remove('active');
                    curIdx = (curIdx + 1) % els.length;
                    els[curIdx].classList.add('active');
                }, 6000);
            }
        });

        // --- CONTENT HUB (VIDEOS & PDFS) ---
        let rawRes = []; let filter = 'all';
        onSnapshot(collection(db, "resources"), (snap) => { rawRes = snap.docs.map(d => ({id: d.id, ...d.data()})); draw(); });

        window.filterType = (t) => { 
            filter = t; 
            document.getElementById('hubTitle').innerText = t === 'all' ? 'Resource Hub' : (t === 'video' ? 'Video Lectures' : 'Study Notes');
            draw(); 
        };
        window.handleSearch = () => draw();

        const getYTId = (url) => url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];

        const draw = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            const isAdmin = auth.currentUser ? '' : 'hidden';
            grid.innerHTML = rawRes.filter(m => (filter === 'all' || m.type === filter) && m.title.toLowerCase().includes(q)).map(m => {
                if(m.type === 'video') {
                    const ytId = getYTId(m.url);
                    return `
                        <div class="card-entry bg-white rounded-[2.5rem] shadow-xl overflow-hidden hover:shadow-2xl transition-all duration-500 group">
                            <div class="relative aspect-video video-overlay cursor-pointer overflow-hidden" onclick="viewVideo('${m.url}')">
                                <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                                <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                                    <div class="play-btn w-16 h-16 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-indigo-600 shadow-2xl transition duration-300">
                                        <i class="fas fa-play ml-1"></i>
                                    </div>
                                </div>
                                <span class="absolute top-4 left-6 bg-indigo-600 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest">${m.level}</span>
                            </div>
                            <div class="p-8">
                                <h3 class="text-xl font-extrabold text-slate-900 mb-2 leading-tight">${m.title}</h3>
                                <p class="text-slate-400 text-sm mb-8 line-clamp-2">${m.desc}</p>
                                <div class="flex justify-between items-center border-t border-slate-50 pt-6">
                                    <span class="text-indigo-600 font-black text-[10px] uppercase tracking-widest">Video Lesson</span>
                                    <button onclick="delRes('${m.id}')" class="${isAdmin} text-red-300 hover:text-red-600 transition"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="card-entry bg-white p-10 rounded-[2.5rem] shadow-xl hover:shadow-2xl transition-all duration-500 relative flex flex-col justify-between">
                            <div>
                                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mb-8 note-float shadow-inner">
                                    <i class="fas fa-file-pdf text-3xl"></i>
                                </div>
                                <span class="text-[10px] font-black text-slate-300 uppercase tracking-[0.2em]">${m.level}</span>
                                <h3 class="text-2xl font-extrabold text-slate-900 mt-2 mb-4 leading-tight">${m.title}</h3>
                                <p class="text-slate-400 text-sm mb-10">${m.desc}</p>
                            </div>
                            <div class="flex justify-between items-center border-t pt-8">
                                <a href="${m.url}" target="_blank" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-extrabold text-sm hover:bg-indigo-600 transition shadow-lg">Download File</a>
                                <button onclick="delRes('${m.id}')" class="${isAdmin} text-red-300 hover:text-red-600 transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        };

        window.delRes = (id) => confirm("Remove this material?") && deleteDoc(doc(db, "resources", id));
        window.addMaterial = async () => {
            await addDoc(collection(db, "resources"), { 
                title: document.getElementById('resTitle').value, type: document.getElementById('resType').value, 
                level: document.getElementById('resLevel').value, url: document.getElementById('resUrl').value, 
                desc: document.getElementById('resDesc').value 
            });
            toggle('resourceModal');
        };

        window.viewVideo = (url) => {
            const id = getYTId(url);
            document.getElementById('vFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0`;
            toggle('videoModal');
        };
        window.closeVideo = () => { document.getElementById('vFrame').src = ""; toggle('videoModal'); };

        // --- AUTH ---
        window.handleLogin = async () => { 
            try { 
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
                toggle('loginModal'); 
            } catch (e) { alert("Access Denied"); } 
        };
        window.logout = () => signOut(auth);
        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminPanel').classList.toggle('hidden', !isAdm);
            document.getElementById('addResBtn').classList.toggle('hidden', !isAdm);
            draw();
        });
        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');
    </script>
</body>
</html>
