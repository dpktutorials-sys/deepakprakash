<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Bhatta Sir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .bg-mesh { background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        /* Full Width Slider */
        .slider-wrap { position: relative; width: 100%; height: 70vh; overflow: hidden; background: #1e293b; }
        .slide { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; 
        }
        .slide.active { opacity: 1; }
        .slider-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; height: 150px;
            background: linear-gradient(to top, #f8fafc, transparent);
            z-index: 10;
        }

        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        .admin-box { border: 2px dashed #6366f1; padding: 4px; border-radius: 12px; }
    </style>
</head>
<body class="bg-mesh min-h-screen flex flex-col">

    <!-- STICKY NAVIGATION -->
    <nav class="sticky top-0 z-[100] glass-nav border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-lg shadow-indigo-200">
                    <i class="fas fa-graduation-cap text-white"></i>
                </div>
                <span class="font-extrabold text-slate-900 tracking-tighter text-xl">YOUR LEARNING SITE</span>
            </div>

            <!-- Nav Links -->
            <div class="hidden md:flex items-center gap-8 font-bold text-slate-500 text-xs uppercase tracking-widest">
                <button onclick="filterType('all')" class="hover:text-indigo-600 transition">Home</button>
                <button onclick="filterType('video')" class="hover:text-indigo-600 transition">Videos</button>
                <button onclick="filterType('note')" class="hover:text-indigo-600 transition">Notes</button>
            </div>

            <!-- Admin Logic -->
            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-[10px] font-black text-slate-400 border border-slate-200 px-4 py-2 rounded-full hover:bg-slate-50 transition uppercase">Admin</button>
                <div id="adminPanel" class="hidden flex items-center gap-3">
                    <button onclick="toggle('imageModal')" class="bg-indigo-600 text-white text-[10px] px-5 py-2.5 rounded-full font-black shadow-lg shadow-indigo-100 uppercase">Manage Slides</button>
                    <button onclick="logout()" class="text-red-500 bg-white border p-2 rounded-full shadow-sm"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- FULL WIDTH HERO SLIDER -->
    <div class="slider-wrap">
        <div id="slider">
            <div class="absolute inset-0 flex items-center justify-center text-slate-500 font-bold bg-slate-100">
                <i class="fas fa-spinner fa-spin mr-3"></i> Loading Slides...
            </div>
        </div>
        <div class="slider-overlay"></div>
    </div>

    <!-- MAIN CONTENT HUB -->
    <main class="max-w-7xl mx-auto px-6 py-16 flex-grow w-full">
        <!-- Search & Hub Header -->
        <div class="flex flex-col md:flex-row items-center justify-between mb-16 gap-8">
            <div class="text-center md:text-left">
                <h2 id="hubTitle" class="text-4xl font-extrabold text-slate-900 tracking-tight">Resource Library</h2>
                <p class="text-slate-400 font-medium mt-1">Study materials by Bhatta Sir</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <div class="flex items-center bg-white px-5 py-3 rounded-2xl border border-slate-100 shadow-sm w-full md:w-80">
                    <i class="fas fa-search text-slate-300 mr-3"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Quick Search..." class="bg-transparent outline-none text-sm w-full font-medium">
                </div>
                <button id="addResBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100 whitespace-nowrap">
                    <i class="fas fa-plus-circle mr-2"></i> Post New Material
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Items injected by JS -->
        </div>
    </main>

    <!-- NAVY BLUE FOOTER -->
    <footer class="bg-[#001b3a] text-white py-16">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="bg-indigo-600 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-2xl">
                <i class="fas fa-graduation-cap text-white text-2xl"></i>
            </div>
            <p class="text-xl font-bold mb-2">© <span id="year"></span> Bhatta Sir. All Rights Reserved.</p>
            <p class="text-slate-400 text-sm font-medium uppercase tracking-widest">Designed by <span class="text-indigo-400">Deepak Prakash Bhatta</span></p>
        </div>
    </footer>

    <!-- MODAL: LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm relative border border-white">
            <button onclick="toggle('loginModal')" class="absolute top-6 right-6 text-slate-300 hover:text-red-500 transition text-2xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-3xl font-black text-slate-900 mb-8">Admin Login</h2>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email Address" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 ring-indigo-500/20">
                <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 ring-indigo-500/20">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 mt-4">Access Dashboard</button>
            </div>
        </div>
    </div>

    <!-- MODAL: SLIDE MANAGER -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-lg relative max-h-[85vh] flex flex-col">
            <button onclick="toggle('imageModal')" class="absolute top-6 right-6 text-slate-300 text-2xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-2xl font-bold mb-6 text-slate-900">Slideshow Editor</h2>
            
            <div class="mb-8 p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center">
                <input type="file" id="fileInp" accept="image/*" class="text-xs w-full mb-4">
                <button onclick="uploadPhoto()" id="upBtn" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg">Upload New Image</button>
            </div>

            <div id="photoList" class="flex-grow overflow-y-auto space-y-4 pr-2">
                <!-- List -->
            </div>
        </div>
    </div>

    <!-- MODAL: ADD RESOURCE -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md relative">
            <button onclick="toggle('resourceModal')" class="absolute top-6 right-6 text-slate-300 text-2xl"><i class="fas fa-times-circle"></i></button>
            <h2 class="text-2xl font-bold mb-6">New Content</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Title" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                <div class="flex gap-4">
                    <select id="resType" class="border rounded-2xl p-4 bg-slate-50 font-bold text-slate-500 outline-none"><option value="video">Video</option><option value="note">Note</option></select>
                    <input type="text" id="resLevel" placeholder="Class/Level" class="flex-1 p-4 border rounded-2xl bg-slate-50 outline-none">
                </div>
                <input type="text" id="resUrl" placeholder="URL Link" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                <textarea id="resDesc" placeholder="Brief description..." class="w-full p-4 border rounded-2xl bg-slate-50 outline-none h-24"></textarea>
                <button onclick="addMaterial()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl">Post to Hub</button>
            </div>
        </div>
    </div>

    <!-- VIDEO MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-8 right-8 text-white/50 text-4xl hover:text-white"><i class="fas fa-times-circle"></i></button>
        <iframe id="vFrame" class="w-full max-w-5xl aspect-video rounded-3xl shadow-2xl" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- FIREBASE SYSTEM -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site",
            storageBucket: "your-learning-site.firebasestorage.app",
            messagingSenderId: "150311153752",
            appId: "1:150311153752:web:50d999325bc866865bda2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        document.getElementById('year').innerText = new Date().getFullYear();

        // SLIDER ENGINE
        let slides = [];
        let curIdx = 0;
        let timer;

        onSnapshot(collection(db, "slideshow"), (snap) => {
            slides = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const container = document.getElementById('slider');
            const list = document.getElementById('photoList');
            
            if(slides.length > 0) {
                container.innerHTML = slides.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = slides.map(s => `
                    <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border">
                        <img src="${s.url}" class="w-16 h-10 object-cover rounded-lg">
                        <button onclick="delImg('${s.id}', '${s.name}')" class="ml-auto text-red-500 font-bold text-xs uppercase">Remove</button>
                    </div>
                `).join('');
                if(timer) clearInterval(timer);
                if(slides.length > 1) timer = setInterval(rotate, 5000);
            } else {
                container.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-slate-300 font-bold uppercase tracking-widest bg-slate-50">Upload images as Admin</div>`;
            }
        });

        const rotate = () => {
            const els = document.querySelectorAll('.slide');
            els[curIdx].classList.remove('active');
            curIdx = (curIdx + 1) % els.length;
            els[curIdx].classList.add('active');
        };

        window.uploadPhoto = async () => {
            const file = document.getElementById('fileInp').files[0];
            if(!file) return alert("Select an image first!");
            const btn = document.getElementById('upBtn');
            btn.innerText = "Working..."; btn.disabled = true;
            try {
                const name = Date.now() + "_" + file.name;
                const sRef = ref(storage, 'slides/' + name);
                await uploadBytes(sRef, file);
                const url = await getDownloadURL(sRef);
                await addDoc(collection(db, "slideshow"), { url, name });
                alert("Image added!");
            } catch (e) { alert("Upload error: " + e.message); }
            btn.innerText = "Upload New Image"; btn.disabled = false;
        };

        window.delImg = async (id, name) => {
            if(confirm("Delete image?")) {
                await deleteDoc(doc(db, "slideshow", id));
                await deleteObject(ref(storage, 'slides/' + name)).catch(() => {});
            }
        };

        // RESOURCE ENGINE
        let rawRes = [];
        let activeFilter = 'all';

        onSnapshot(collection(db, "resources"), (snap) => {
            rawRes = snap.docs.map(d => ({id: d.id, ...d.data()}));
            draw();
        });

        window.filterType = (t) => {
            activeFilter = t;
            document.getElementById('hubTitle').innerText = t === 'all' ? 'Resource Library' : (t === 'video' ? 'Video Lectures' : 'Study Notes');
            draw();
        };

        const draw = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            const isAdmin = auth.currentUser ? '' : 'hidden';

            const filtered = rawRes.filter(m => {
                const matchType = activeFilter === 'all' || m.type === activeFilter;
                const matchSearch = m.title.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q);
                return matchType && matchSearch;
            });

            grid.innerHTML = filtered.map(m => `
                <div class="bg-white p-8 rounded-[2.5rem] card-shadow border border-slate-50 group hover:shadow-2xl transition-all duration-300">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-14 h-14 ${m.type==='video'?'bg-red-50 text-red-500':'bg-indigo-50 text-indigo-600'} rounded-2xl flex items-center justify-center shadow-inner">
                            <i class="fas ${m.type==='video'?'fa-play':'fa-file-pdf'} text-xl"></i>
                        </div>
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest pt-3">${m.level}</span>
                    </div>
                    <h3 class="text-xl font-extrabold text-slate-900 mb-3 leading-tight group-hover:text-indigo-600 transition">${m.title}</h3>
                    <p class="text-slate-400 text-sm mb-10 line-clamp-2 leading-relaxed">${m.desc}</p>
                    <div class="flex justify-between items-center pt-6 border-t border-slate-50">
                        ${m.type === 'video' ? 
                            `<button onclick="viewVideo('${m.url}')" class="text-indigo-600 font-bold hover:translate-x-1 transition flex items-center gap-2">Watch Class <i class="fas fa-arrow-right text-[10px]"></i></button>` : 
                            `<a href="${m.url}" target="_blank" class="text-slate-900 font-bold hover:text-indigo-600 transition flex items-center gap-2">Open Notes <i class="fas fa-external-link-alt text-[10px]"></i></a>`
                        }
                        <button onclick="delRes('${m.id}')" class="${isAdmin} text-red-300 hover:text-red-500 transition"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        };

        window.handleSearch = () => draw();
        window.delRes = (id) => confirm("Delete this resource?") && deleteDoc(doc(db, "resources", id));

        window.addMaterial = async () => {
            const data = {
                title: document.getElementById('resTitle').value,
                type: document.getElementById('resType').value,
                level: document.getElementById('resLevel').value,
                url: document.getElementById('resUrl').value,
                desc: document.getElementById('resDesc').value
            };
            if(!data.title || !data.url) return alert("Required fields missing");
            await addDoc(collection(db, "resources"), data);
            toggle('resourceModal');
        };

        window.viewVideo = (url) => {
            const id = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
            document.getElementById('vFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            toggle('videoModal');
        };
        window.closeVideo = () => { document.getElementById('vFrame').src = ""; toggle('videoModal'); };

        // AUTH SYSTEM
        window.handleLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                toggle('loginModal');
            } catch (e) { alert("Login failed: " + e.message); }
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminPanel').classList.toggle('hidden', !isAdm);
            document.getElementById('addResBtn').classList.toggle('hidden', !isAdm);
            draw();
        });

        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');
    </script>
</body>
</html>
