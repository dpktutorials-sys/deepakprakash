<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPK TUTORIALS - Educational Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; background: #f8fafc; }
        .brand-font { font-family: 'Orbitron', sans-serif; }
        .dpk-red { color: #FF0000; } .tut-blue { color: #0000FF; }
        .subtitle-green { color: #22c55e; font-size: 9px; font-weight: 800; letter-spacing: 1px; }

        .glass-nav { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); transition: 0.4s; position: fixed; top: 0; width: 100%; z-index: 100; }
        .nav-hidden { transform: translateY(-100%); }
        
        .slider-wrap { position: relative; width: 100%; height: 45vh; overflow: hidden; background: #0f172a; margin-top: 80px; }
        @media (min-width: 1024px) { .slider-wrap { height: 70vh; } }
        .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 1s; }
        .slide.active { opacity: 1; }
        
        /* FILE BRANDING COLORS */
        .head-pdf { background: #ef4444; } /* Red */
        .head-doc { background: #facc15; } /* Yellow */
        .head-ppt { background: #22c55e; } /* Green */
        .head-sim { background: #8b5cf6; } /* Purple */
        .head-vid { background: #000000; } /* Black */

        .card-entry { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .card-entry:hover { transform: translateY(-5px); box-shadow: 0 20px 30px -10px rgba(0,0,0,0.1); }
        
        .thumb-box { position: relative; aspect-ratio: 16/9; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav id="mainNav" class="glass-nav border-b">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex flex-col cursor-pointer" onclick="location.reload()">
                <div class="flex items-center brand-font text-2xl lg:text-3xl uppercase">
                    <span class="dpk-red">DPK</span> <span class="tut-blue ml-2">TUTORIALS</span>
                </div>
                <div class="subtitle-green uppercase">Out and Out Educational Site</div>
            </div>
            <div class="hidden md:flex items-center gap-6 font-bold text-slate-500 text-[10px] uppercase">
                <button onclick="window.filterType('all')">Home</button>
                <button onclick="window.filterType('video')">Videos</button>
                <button onclick="window.filterType('note')">Notes</button>
                <button onclick="window.filterType('sim')">Simulations</button>
            </div>
            <div class="flex gap-2">
                <button id="loginBtn" onclick="window.toggle('loginModal')" class="text-[10px] font-bold border px-3 py-1.5 rounded-full uppercase">Admin</button>
                <div id="adminPanel" class="hidden flex gap-2">
                    <button onclick="window.toggle('imageModal')" class="bg-indigo-600 text-white text-[10px] px-4 py-2 rounded-full font-bold">SLIDER</button>
                    <button onclick="window.logout()" class="text-red-500"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="slider-wrap"><div id="slider" class="w-full h-full"></div></div>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="flex flex-col md:flex-row items-center justify-between mb-10 gap-4">
            <h2 id="hubTitle" class="text-3xl font-black text-slate-900 tracking-tighter uppercase">Resource Hub</h2>
            <div class="flex gap-2 w-full md:w-auto">
                <input type="text" id="searchInput" oninput="window.handleSearch()" placeholder="Search..." class="bg-white border rounded-xl px-4 py-2 w-full md:w-64 outline-none">
                <button id="addResBtn" onclick="window.toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold whitespace-nowrap shadow-lg">Add New</button>
            </div>
        </div>
        <div id="resourceGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <footer class="bg-[#001b3a] text-white py-12 text-center">
        <p class="font-bold text-xl brand-font"><span class="dpk-red">DPK</span> <span class="tut-blue">TUTORIALS</span></p>
        <p class="text-slate-400 text-xs mt-2 uppercase">Designed by Deepak Prakash Bhatta</p>
        <p class="text-slate-500 text-[10px] mt-2">© <span id="year"></span> All Rights Reserved</p>
    </footer>

    <!-- MODAL FOR VIDEO & SIMULATIONS ONLY -->
    <div id="contentModal" onclick="window.handleOutsideClick(event)" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-4">
        <button onclick="window.closeContent()" class="absolute top-6 right-6 text-white text-5xl">&times;</button>
        <div id="modalBody" class="w-full h-[80vh] bg-white rounded-2xl overflow-hidden shadow-2xl">
            <iframe id="cFrame" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
        <h3 id="modalTitle" class="text-white mt-4 font-bold uppercase tracking-widest text-center"></h3>
    </div>

    <!-- ADMIN MODALS (Add Content, Login, Slider) -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[200] p-4 overflow-y-auto">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md my-8 relative">
            <h2 class="text-2xl font-bold mb-6">Publish Content</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Title (e.g. Science.pdf)" class="w-full p-4 border rounded-xl outline-none">
                <div class="flex gap-2">
                    <select id="resType" class="border rounded-xl p-4 bg-white outline-none" onchange="window.updateForm(this.value)">
                        <option value="video">Video</option>
                        <option value="note">Note/File</option>
                        <option value="sim">Simulation</option>
                    </select>
                    <input type="text" id="resLevel" placeholder="Level/Grade" class="flex-1 p-4 border rounded-xl">
                </div>
                <div id="htmlPasteBox" class="hidden">
                    <textarea id="resHtmlContent" placeholder="Paste HTML simulation code here..." class="w-full p-4 border rounded-xl h-32 text-xs font-mono"></textarea>
                </div>
                <div id="autoThumbBox" class="hidden p-4 bg-indigo-50 rounded-xl border-2 border-dashed border-indigo-200 text-center">
                    <input type="file" id="resFile" accept=".pdf,.html,image/*" class="text-xs w-full">
                </div>
                <input type="text" id="resUrl" placeholder="Link (YouTube or Drive)" class="w-full p-4 border rounded-xl outline-none">
                <textarea id="resDesc" placeholder="Description..." class="w-full p-4 border rounded-xl h-20"></textarea>
                <button onclick="window.addMaterial()" id="publishBtn" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-xl">PUBLISH</button>
                <button onclick="window.toggle('resourceModal')" class="w-full text-slate-400 mt-2 font-bold text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[200] p-4"><div class="bg-white p-10 rounded-[2rem] w-full max-w-sm"><h2 class="text-2xl font-bold mb-6 text-center uppercase">Login</h2><input type="email" id="email" placeholder="Email" class="w-full p-4 border rounded-xl mb-4"><input type="password" id="password" placeholder="Password" class="w-full p-4 border rounded-xl mb-6"><button onclick="window.handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">Enter</button></div></div>
    <div id="imageModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[200] p-4"><div class="bg-white p-8 rounded-[2rem] w-full max-w-lg flex flex-col max-h-[80vh]"><h2 class="text-xl font-bold mb-4">Manage Gallery</h2><input type="file" id="fileInp" accept="image/*" class="mb-4 text-xs"><button onclick="window.savePhoto()" id="upBtn" class="bg-indigo-600 text-white py-3 rounded-xl font-bold">Upload</button><div id="photoList" class="overflow-y-auto mt-6 space-y-3"></div><button onclick="window.toggle('imageModal')" class="mt-4 text-slate-400 font-bold uppercase text-[10px]">Close</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, collection, addDoc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk", authDomain: "your-learning-site.firebaseapp.com", projectId: "your-learning-site" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        document.getElementById('year').innerText = new Date().getFullYear();

        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');
        window.updateForm = (val) => {
            document.getElementById('autoThumbBox').classList.toggle('hidden', val === 'video');
            document.getElementById('htmlPasteBox').classList.toggle('hidden', val !== 'sim');
        };
        window.handleLogin = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); window.toggle('loginModal'); } catch (e) { alert("Error"); } };
        window.logout = () => signOut(auth);
        window.delItem = async (col, id) => { if(confirm("Confirm Delete?")) { try { await deleteDoc(doc(db, col, id)); } catch (e) { alert(e.message); } } };

        // SLIDER
        onSnapshot(query(collection(db, "slideshow"), orderBy("createdAt", "desc")), (snap) => {
            const slider = document.getElementById('slider'); const list = document.getElementById('photoList');
            const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
            if(data.length > 0) {
                slider.innerHTML = data.map((s, i) => `<img src="${s.url}" class="slide ${i===0?'active':''}">`).join('');
                list.innerHTML = data.map(s => `<div class="flex items-center gap-4 bg-slate-50 p-2 border rounded-xl"><img src="${s.url}" class="w-16 h-10 object-cover rounded shadow-sm"><button onclick="window.delItem('slideshow', '${s.id}')" class="ml-auto text-red-500 font-bold text-xs">Remove</button></div>`).join('');
                let cur = 0; setInterval(() => { const els = document.querySelectorAll('.slide'); if(els.length < 2) return; els[cur].classList.remove('active'); cur = (cur+1)%els.length; els[cur].classList.add('active'); }, 6000);
            }
        });

        window.savePhoto = () => {
            const file = document.getElementById('fileInp').files[0]; if(!file) return alert("Select photo");
            const btn = document.getElementById('upBtn'); btn.innerText = "WAIT...";
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = async () => {
                    const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
                    cvs.width = 1600; cvs.height = img.height * (1600 / img.width); ctx.drawImage(img, 0,0,1600,cvs.height);
                    await addDoc(collection(db, "slideshow"), { url: cvs.toDataURL('image/jpeg', 0.8), createdAt: Date.now() });
                    btn.innerText = "Upload"; alert("Done!");
                };
            };
        };

        // HUB
        let rawData = []; let currentFilter = 'all';
        onSnapshot(collection(db, "resources"), (snap) => { rawData = snap.docs.map(d => ({id: d.id, ...d.data()})); window.draw(); });

        window.filterType = (t) => { currentFilter = t; document.getElementById('hubTitle').innerText = t==='all'?'Resource Hub':t.toUpperCase(); window.draw(); };
        window.handleSearch = () => window.draw();

        window.draw = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            const isAdm = auth.currentUser ? '' : 'hidden';

            grid.innerHTML = rawData.filter(m => (currentFilter === 'all' || m.type === currentFilter) && (m.title.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q))).map(m => {
                let color = 'head-gen'; let icon = 'fa-file-alt'; let t = m.title.toLowerCase();
                if(m.type === 'video') color = 'head-vid', icon = 'fa-play';
                else if(m.type === 'sim') color = 'head-sim', icon = 'fa-flask';
                else if(t.includes('pdf')) color = 'head-pdf', icon = 'fa-file-pdf';
                else if(t.includes('doc')) color = 'head-doc', icon = 'fa-file-word';
                else if(t.includes('ppt')) color = 'head-ppt', icon = 'fa-file-powerpoint';

                const thumb = m.thumb ? `<img src="${m.thumb}" class="thumb-img opacity-80">` : `<div class="flex flex-col items-center"><i class="fas ${icon} text-5xl mb-2"></i><span class="text-[10px] font-black uppercase">Content</span></div>`;

                return `<div class="card-entry">
                    <div class="thumb-box ${color}">${thumb}<span class="absolute top-4 left-6 bg-white text-black text-[9px] font-black px-3 py-1 rounded-full uppercase">${m.level}</span></div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="font-bold text-slate-900 mb-2 leading-tight">${m.title}</h3>
                        <p class="text-xs text-slate-500 mb-6 line-clamp-2">${m.desc}</p>
                        <div class="mt-auto flex justify-between items-center">
                            ${m.type==='note' ? `<button onclick="window.open('${m.url}', '_blank')" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-[10px] font-bold">OPEN IN NEW TAB</button>` : `<button onclick="window.viewContent(\`${m.url}\`, '${m.type}', \`${m.title}\`, ${m.isRaw})" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-[10px] font-bold">OPEN ${m.type.toUpperCase()}</button>`}
                            <button onclick="window.delItem('resources', '${m.id}')" class="${isAdm} text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        window.addMaterial = async () => {
            const btn = document.getElementById('publishBtn'); btn.innerText = "WAIT..."; btn.disabled = true;
            const type = document.getElementById('resType').value; const title = document.getElementById('resTitle').value;
            const level = document.getElementById('resLevel').value; const desc = document.getElementById('resDesc').value;
            const file = document.getElementById('resFile').files[0]; const pastedHtml = document.getElementById('resHtmlContent').value;
            let url = document.getElementById('resUrl').value; let thumbData = null; let isRaw = false;

            if (type === 'sim' && pastedHtml.trim() !== "") { url = pastedHtml; isRaw = true; }
            if (file) {
                const reader = new FileReader();
                const result = await new Promise((res) => { reader.onload = () => res(reader.result); if(file.name.endsWith('.html')) reader.readAsText(file); else reader.readAsArrayBuffer(file); });
                if(file.name.endsWith('.html')) { url = result; isRaw = true; }
                else if(file.type === "application/pdf") {
                    const pdf = await pdfjsLib.getDocument({ data: result }).promise;
                    const page = await pdf.getPage(1); const vp = page.getViewport({ scale: 1 });
                    const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d'); cvs.height = vp.height; cvs.width = vp.width;
                    await page.render({ canvasContext: ctx, viewport: vp }).promise; thumbData = cvs.toDataURL('image/jpeg', 0.8);
                }
            }
            await addDoc(collection(db, "resources"), { title, type, level, url, desc, thumb: thumbData, isRaw, createdAt: Date.now() });
            window.toggle('resourceModal'); btn.innerText = "PUBLISH"; btn.disabled = false;
        };

        window.viewContent = (url, type, title, isRaw) => {
            const frame = document.getElementById('cFrame');
            frame.src = ""; frame.srcdoc = ""; 
            if (isRaw === true || isRaw === "true") { frame.srcdoc = url; } 
            else if (type === 'video') {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                const vidId = (match && match[2].length === 11) ? match[2] : null;
                frame.src = `https://www.youtube.com/embed/${vidId}?autoplay=1&rel=0`;
            } else { frame.src = url; }
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('contentModal').classList.remove('hidden');
        };

        window.closeContent = () => { document.getElementById('cFrame').src = ""; document.getElementById('cFrame').srcdoc = ""; document.getElementById('contentModal').classList.add('hidden'); };
        window.handleOutsideClick = (e) => { if(e.target.id === 'contentModal') window.closeContent(); };

        let lastY = window.scrollY;
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > lastY && window.scrollY > 200) nav.classList.add('nav-hidden');
            else nav.classList.remove('nav-hidden');
            lastY = window.scrollY;
        });

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user; document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminPanel').classList.toggle('hidden', !isAdm);
            document.getElementById('addResBtn').classList.toggle('hidden', !isAdm); window.draw();
        });
    </script>
</body>
</html>
