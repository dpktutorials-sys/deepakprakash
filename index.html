<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR LEARNING SITE - Bhatta Sir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .bg-mesh {
            background-image: radial-gradient(at 0% 0%, hsla(45,100%,93%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(260,100%,95%,1) 0, transparent 50%);
        }
        .editing-mode { border: 2px dashed #4f46e5 !important; background: rgba(79, 70, 229, 0.05); padding: 4px; border-radius: 8px; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .nav-link.active { color: #4f46e5; border-bottom: 2px solid #4f46e5; }
    </style>
</head>
<body class="bg-mesh min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav class="sticky top-0 z-[100] bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg"><i class="fas fa-graduation-cap text-white text-sm"></i></div>
                <span class="font-black text-slate-900 tracking-tight">YOUR LEARNING SITE</span>
            </div>

            <div class="hidden md:flex items-center gap-8 font-bold text-slate-600">
                <button onclick="filterContent('all')" class="nav-link active py-2 transition" id="nav-all">Home</button>
                <button onclick="filterContent('video')" class="nav-link py-2 transition" id="nav-video">Videos</button>
                <button onclick="filterContent('note')" class="nav-link py-2 transition" id="nav-note">Notes</button>
            </div>

            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="toggle('loginModal')" class="text-sm font-bold text-slate-500 hover:text-indigo-600">Admin</button>
                <div id="adminTools" class="hidden flex gap-2">
                    <button onclick="saveHero()" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold">SAVE HEADER</button>
                    <button onclick="logout()" class="text-red-500"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="max-w-7xl mx-auto px-10 pt-16 pb-12 flex flex-col lg:flex-row items-center">
        <div class="lg:w-1/2 space-y-8">
            <h1 class="text-5xl lg:text-7xl font-extrabold text-slate-900 leading-tight">
                <span id="txt-blue" class="text-indigo-600">Smart Study</span><br>
                <span id="txt-black">With Bhatta Sir</span>
            </h1>
            <p id="txt-desc" class="text-slate-500 text-xl max-w-lg">Empowering students with high-quality video lessons and comprehensive study notes.</p>
            
            <!-- DYNAMIC SEARCH BAR -->
            <div class="flex items-center bg-white p-2 rounded-2xl shadow-xl max-w-lg border border-slate-100 focus-within:ring-2 ring-indigo-100 transition">
                <i class="fas fa-search ml-4 text-slate-300"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search topics, videos, or notes..." class="flex-1 px-4 py-3 outline-none text-slate-600 bg-transparent font-medium">
                <button class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg">Search</button>
            </div>
        </div>
        <div class="lg:w-1/2 flex justify-center mt-12 lg:mt-0">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=600&q=80" class="rounded-[2.5rem] w-full max-w-md shadow-2xl border-8 border-white">
        </div>
    </header>

    <!-- STUDY HUB -->
    <main id="hub" class="max-w-7xl mx-auto px-10 py-10 flex-grow w-full">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 id="hubTitle" class="text-3xl font-extrabold text-slate-900">All Resources</h2>
                <div class="h-1 w-20 bg-indigo-600 rounded-full mt-2"></div>
            </div>
            <button id="addResourceBtn" onclick="toggle('resourceModal')" class="hidden bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2">
                <i class="fas fa-plus"></i> Add New Material
            </button>
        </div>

        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Content Loads Here -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-100 py-12 mt-20">
        <div class="max-w-7xl mx-auto px-10 text-center">
            <div class="flex justify-center gap-2 mb-4">
                <div class="bg-slate-900 p-2 rounded-lg"><i class="fas fa-graduation-cap text-white"></i></div>
            </div>
            <p class="text-slate-900 font-bold text-lg">© 2024 Bhatta Sir. All Rights Reserved.</p>
            <p class="text-slate-400 text-sm mt-2 font-medium">Designed by <span class="text-indigo-600">Deepak Prakash Bhatta</span></p>
        </div>
    </footer>

    <!-- VIDEO PLAYER MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-[200] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideo()" class="absolute top-6 right-6 text-white text-3xl hover:text-red-500"><i class="fas fa-times"></i></button>
        <div class="w-full max-w-5xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl">
            <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <h2 id="videoModalTitle" class="text-white text-xl font-bold mt-6"></h2>
    </div>

    <!-- ADMIN: ADD RESOURCE MODAL -->
    <div id="resourceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-lg mx-4">
            <h2 class="text-2xl font-bold mb-6">Publish Material</h2>
            <div class="space-y-4">
                <input type="text" id="resTitle" placeholder="Topic Title (e.g. Calculus Basics)" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <select id="resType" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold text-slate-600">
                        <option value="video">Level: Video</option>
                        <option value="note">Level: Note</option>
                    </select>
                    <input type="text" id="resLevel" placeholder="Class/Level (e.g. Grade 10)" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                </div>
                <input type="text" id="resUrl" placeholder="Paste YouTube Link or Note URL" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <textarea id="resDesc" placeholder="Briefly explain what's inside..." class="w-full p-4 bg-slate-50 border rounded-xl outline-none h-24"></textarea>
                <div class="flex gap-4 pt-4">
                    <button onclick="toggle('resourceModal')" class="flex-1 bg-slate-100 text-slate-500 font-bold py-4 rounded-xl">Cancel</button>
                    <button onclick="addNewResource()" class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg">Publish Now</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ADMIN: LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Access</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-xl mb-4 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-xl mb-6 outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg">Enter Dashboard</button>
        </div>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAqpdfNz-fb4v3g1AawHGSCpOcxP5QHfk",
            authDomain: "your-learning-site.firebaseapp.com",
            projectId: "your-learning-site",
            storageBucket: "your-learning-site.firebasestorage.app",
            messagingSenderId: "150311153752",
            appId: "1:150311153752:web:50d999325bc866865bda2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allMaterials = [];
        let currentFilter = 'all';

        // --- FILTER & SEARCH LOGIC ---
        window.filterContent = (type) => {
            currentFilter = type;
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(`nav-${type}`).classList.add('active');
            document.getElementById('hubTitle').innerText = type === 'all' ? 'All Resources' : (type === 'video' ? 'Video Lectures' : 'Study Notes');
            renderUI();
        };

        window.handleSearch = () => renderUI();

        function renderUI() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('resourceGrid');
            grid.innerHTML = '';

            const filtered = allMaterials.filter(m => {
                const matchesType = currentFilter === 'all' || m.type === currentFilter;
                const matchesSearch = m.title.toLowerCase().includes(query) || m.desc.toLowerCase().includes(query) || (m.level && m.level.toLowerCase().includes(query));
                return matchesType && matchesSearch;
            });

            filtered.forEach(m => {
                const isAdmin = auth.currentUser ? '' : 'hidden';
                if(m.type === 'video') {
                    const ytId = m.url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
                    grid.innerHTML += `
                        <div class="glass-card rounded-[2rem] overflow-hidden shadow-sm group">
                            <div class="relative cursor-pointer aspect-video bg-slate-900" onclick="playVideo('${m.url}', '${m.title}')">
                                <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition">
                                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <div class="bg-indigo-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-xl"><i class="fas fa-play ml-1"></i></div>
                                </div>
                                <span class="absolute top-4 left-4 bg-black/50 backdrop-blur-md text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-tighter">${m.level || 'Tutorial'}</span>
                            </div>
                            <div class="p-6">
                                <h3 class="text-lg font-extrabold text-slate-900 leading-tight mb-2">${m.title}</h3>
                                <p class="text-slate-400 text-sm mb-6 line-clamp-2">${m.desc}</p>
                                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                                    <span class="text-indigo-600 font-bold text-xs uppercase">Video Class</span>
                                    <button onclick="deleteDoc(doc(db, 'resources', '${m.id}'))" class="${isAdmin} text-red-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    grid.innerHTML += `
                        <div class="glass-card p-8 rounded-[2rem] shadow-sm flex flex-col justify-between h-full relative group">
                            <div>
                                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mb-6"><i class="fas fa-file-alt text-xl"></i></div>
                                <span class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">${m.level || 'General Notes'}</span>
                                <h3 class="text-xl font-extrabold text-slate-900 mt-2 mb-3 leading-tight">${m.title}</h3>
                                <p class="text-slate-400 text-sm mb-6">${m.desc}</p>
                            </div>
                            <div class="flex justify-between items-center">
                                <a href="${m.url}" target="_blank" class="bg-slate-900 text-white px-6 py-2.5 rounded-full text-xs font-bold hover:bg-indigo-600 transition">View Material</a>
                                <button onclick="deleteDoc(doc(db, 'resources', '${m.id}'))" class="${isAdmin} text-red-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        // --- CORE ACTIONS ---
        onSnapshot(collection(db, "resources"), (snap) => {
            allMaterials = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderUI();
        });

        window.addNewResource = async () => {
            const data = {
                title: document.getElementById('resTitle').value,
                type: document.getElementById('resType').value,
                level: document.getElementById('resLevel').value,
                url: document.getElementById('resUrl').value,
                desc: document.getElementById('resDesc').value,
                date: Date.now()
            };
            if(!data.title || !data.url) return alert("Title and URL are required");
            await addDoc(collection(db, "resources"), data);
            toggle('resourceModal');
        };

        window.playVideo = (url, title) => {
            const id = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('videoModalTitle').innerText = title;
            document.getElementById('videoModal').classList.remove('hidden');
        };

        window.closeVideo = () => {
            document.getElementById('videoFrame').src = "";
            document.getElementById('videoModal').classList.add('hidden');
        };

        // --- AUTH & HERO ---
        window.handleLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                toggle('loginModal');
            } catch (e) { alert(e.message); }
        };
        window.logout = () => signOut(auth);

        window.saveHero = async () => {
            await setDoc(doc(db, "siteData", "hero"), {
                blue: document.getElementById('txt-blue').innerText,
                black: document.getElementById('txt-black').innerText,
                desc: document.getElementById('txt-desc').innerText
            });
            alert("Header Saved!");
        };

        onAuthStateChanged(auth, (user) => {
            const isAdm = !!user;
            document.getElementById('loginBtn').classList.toggle('hidden', isAdm);
            document.getElementById('adminTools').classList.toggle('hidden', !isAdm);
            document.getElementById('addResourceBtn').classList.toggle('hidden', !isAdm);
            ['txt-blue', 'txt-black', 'txt-desc'].forEach(id => {
                const el = document.getElementById(id);
                el.contentEditable = isAdm;
                isAdm ? el.classList.add('editing-mode') : el.classList.remove('editing-mode');
            });
        });

        window.toggle = (id) => document.getElementById(id).classList.toggle('hidden');

        // Load Header Data
        const hSnap = await getDoc(doc(db, "siteData", "hero"));
        if(hSnap.exists()) {
            document.getElementById('txt-blue').innerText = hSnap.data().blue;
            document.getElementById('txt-black').innerText = hSnap.data().black;
            document.getElementById('txt-desc').innerText = hSnap.data().desc;
        }
    </script>
</body>
</html>
